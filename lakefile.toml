name = "SomaField"
defaultTargets = [
  "EmotionOntology", "Hopfield", "FieldProofs", "SomaField",
  "DyadicField", "LimbicTunnel", "MTheoryIsomorphism", "LimbicHopfield",
  "SwarmPropagator", "UniversalSomaticField", "Movie",
  "QuantumSim", "SomaNetwork", "ScaleUniverse", "Benchmark", "BFSSIsomorphism",
  "TemporalDynamics", "RenormalisationGroup", "USF_OSAxioms",
  "LocalGR", "G2Compactification", "BRECVEMAField", "LocalGeometry"
]

# ---------------------------------------------------------------------------
# Dependencies — mathlib LAST so our v4.31.0 pin wins over transitive pins
# ---------------------------------------------------------------------------

[[require]]
# physlib v4.31.0
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.31.0"

[[require]]
# OSforGFF at pre-PR6 commit — written for v4.29.0, patching transitive deps for v4.31.0
name = "OSforGFF"
git = "https://github.com/mrdouglasny/OSforGFF.git"
rev = "60ab679e09b764de6dfe01767ae361ac1bea30b8"

[[require]]
# Mathlib LAST — overrides any transitive pins from OSforGFF
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

# ---------------------------------------------------------------------------
# Library targets — one per proof file (flat directory, no module hierarchy)
# All files live in paper/proofs/; each is its own top-level module.
# ---------------------------------------------------------------------------

[[lean_lib]]
name = "EmotionOntology"
srcDir = "paper/proofs"

