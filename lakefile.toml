name = "SomaField"
defaultTargets = [
  "EmotionOntology", "Hopfield", "FieldProofs", "SomaField",
  "DyadicField", "LimbicTunnel", "MTheoryIsomorphism", "LimbicHopfield",
  "SwarmPropagator", "UniversalSomaticField", "Movie",
  "QuantumSim", "SomaNetwork", "ScaleUniverse", "Benchmark", "BFSSIsomorphism",
  "TemporalDynamics", "RenormalisationGroup", "USF_OSAxioms", "CosmologicalConstant",
  "LocalGR", "G2Compactification", "BRECVEMAField", "BRECVEMAVariational", "LocalGeometry",
  "SomaPhilosophy"
]

# ---------------------------------------------------------------------------
# Dependencies — mathlib LAST so our pin wins over transitive pins.
# Lean, Mathlib and physlib at v4.33.0. OSforGFF (with GaussianField and
# BochnerMinlos) at an upstream commit written for Mathlib v4.33.0-rc1; the
# one-line compatibility fix is in lean/patches/v4.33/ (upstream PR #22).
# ---------------------------------------------------------------------------

[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.33.0"

[[require]]
name = "OSforGFF"
git = "https://github.com/mrdouglasny/OSforGFF.git"
rev = "fef84a82937dfd2bb7f672108a72da329d3ef0fd"

[[require]]
# Mathlib LAST — overrides any transitive pins from OSforGFF
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# ---------------------------------------------------------------------------
# Library targets — one per proof file (flat directory, no module hierarchy)
# All files live in paper/proofs/; each is its own top-level module.
# ---------------------------------------------------------------------------

[[lean_lib]]
name = "EmotionOntology"
srcDir = "paper/proofs"

