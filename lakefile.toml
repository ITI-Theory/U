name = "SomaField"
defaultTargets = [
  "EmotionOntology", "Hopfield", "FieldProofs", "SomaField",
  "DyadicField", "LimbicTunnel", "MTheoryIsomorphism", "LimbicHopfield",
  "SwarmPropagator", "UniversalSomaticField", "Movie",
  "QuantumSim", "SomaNetwork", "ScaleUniverse", "Benchmark"
]

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[[require]]
# Mathlib: the community Lean 4 mathematics library (~200k theorems)
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
# Physlib (formerly PhysLean / HepLean): physics formalisation library.
# Contains: QuantumInfo (density matrices, quantum channels, Stein's lemma),
#           Physlib (quantum mechanics, field theory, particle physics).
# Relevant for: LimbicTunnel WKB, QuantumSim, SomaNetwork, QUANT-EXP-1.
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.31.0"

# ---------------------------------------------------------------------------
# Library targets — one per proof file (flat directory, no module hierarchy)
# All files live in paper/proofs/; each is its own top-level module.
# ---------------------------------------------------------------------------

[[lean_lib]]
name = "EmotionOntology"
srcDir = "paper/proofs"

[[lean_lib]]
name = "Hopfield"
srcDir = "paper/proofs"

[[lean_lib]]
name = "FieldProofs"
srcDir = "paper/proofs"

[[lean_lib]]
name = "SomaField"
srcDir = "paper/proofs"

[[lean_lib]]
name = "DyadicField"
srcDir = "paper/proofs"

[[lean_lib]]
name = "LimbicTunnel"
srcDir = "paper/proofs"

[[lean_lib]]
name = "MTheoryIsomorphism"
srcDir = "paper/proofs"

[[lean_lib]]
name = "LimbicHopfield"
srcDir = "paper/proofs"

[[lean_lib]]
name = "SwarmPropagator"
srcDir = "paper/proofs"

[[lean_lib]]
name = "UniversalSomaticField"
srcDir = "paper/proofs"

[[lean_lib]]
name = "Movie"
srcDir = "paper/proofs"

[[lean_lib]]
name = "QuantumSim"
srcDir = "paper/proofs"

[[lean_lib]]
name = "SomaNetwork"
srcDir = "paper/proofs"

[[lean_lib]]
name = "ScaleUniverse"
srcDir = "paper/proofs"

[[lean_lib]]
name = "Benchmark"
srcDir = "paper/proofs"
