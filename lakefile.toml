name = "SomaField"
defaultTargets = ["SomaField"]

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[[require]]
# Mathlib: the community Lean 4 mathematics library (~200k theorems)
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[require]]
# Physlib (formerly PhysLean / HepLean): physics formalisation library.
# Contains: QuantumInfo (density matrices, quantum channels, Stein's lemma),
#           Physlib (quantum mechanics, field theory, particle physics),
#           PhyslibAlpha (lower review bar; AI-generated content welcome).
# Relevant for: LimbicTunnel WKB, QuantumSim, SomaNetwork, QUANT-EXP-1.
# After adding: run `lake exe cache get && lake build` (~1-2 GB download).
name = "physlib"
git = "https://github.com/leanprover-community/physlib.git"
rev = "v4.31.0"

# ---------------------------------------------------------------------------
# Library target
# ---------------------------------------------------------------------------

[[lean_lib]]
name = "SomaField"
# All proof files live in paper/proofs/
srcDir = "paper/proofs"
# Allow sorry for Open Problem stubs (they are explicitly marked)
moreLeanArgs = ["-Dwarn.sorry=true"]
