# A Gallery of Thoughts (ISS-097), the projector edition: 16:9, no bleed, to be shown big (one plate a slide).
citeproc: false
defaults:
  - ../../../lib/defaults/base-pdf.yaml
metadata-file: ../../../registry/gallery.yaml
input-files:
  - gallery.md
output-file: ../../../bld/gallery/gallery-of-thoughts-projector.tex
to: latex
toc: false
resource-path:
  - .
  - ../../..
include-in-header:
  - templates/gallery-header.tex
variables:
  geometry: paperwidth=320mm,paperheight=180mm,left=34mm,right=34mm,top=18mm,bottom=18mm
  fontsize: 10pt
  colorlinks: false
filters:
  - filters/gallery.lua
  - ../../../lib/format/unicode-glyphs.lua
  - ../../../lib/format/licence.lua
metadata:
  plate-dir: ../../../bld/gallery/plates/projector