id: field-atlas
title: "[T]-Theory: Field Atlas"
subtitle: The Wave That Is Always There
# Ladder order, partitioning the canonical-5 bands (a level shared by two bands sits in the first). Level text lives in registry/levels/<id>.md (shared with the app);
# sector introductions in sectors/, front and back matter in front/ and back/.
sectors:
  - file: sectors/1-quantum-to-classical.md
    levels: [quantum-foam, string-boundary, nuclear, atomic, molecular]
  - file: sectors/2-chemistry-to-biology.md
    levels: [cellular-synaptic, local-circuit, whole-brain-cemi, human-vertebrate]
  - file: sectors/3-individual-to-collective.md
    levels: [dyad, human-group, animal-swarm, bird, flock, colony-roost, society-city, regional-institutional, civilisational-solar, species-stellar]
  - file: sectors/4-geological-to-stellar.md
    levels: [geological, planetary, orbital-system, stellar, compact-object]
  - file: sectors/5-stellar-to-cosmic.md
    levels: [stellar-cluster, galactic-disc, galactic-halo, galaxy-cluster, cosmic-filaments, observable-universe, cosmic-web]
# The Voyage Inside (ISS-087): the mind-body explorer's stops as plates with text, a part after
# sector 3. Each plate is captured from the app (capture.mjs --only voyage: the view is the
# app's address, acts are buttons pressed after it opens, atlas=1 strips the controls) into
# figures/app/voyage/<id>.png; each stop's prose, plate captions (::: {.plate id=...}) and any
# theory figure (::: {.figure src=...}) are in its voyage/ file.
voyage:
  after_sector: 3
  file: voyage/0-the-voyage-inside.md
  stops:
    - file: voyage/01-the-jellyfish-human.md
      plates:
        - {id: human, view: "voyage=human&dim=11&phi=0.6"}
    - file: voyage/02-the-body.md
      plates:
        - {id: body-fight, view: "voyage=body&dim=4&phi=0.6&feel=fight"}
        - {id: body-grief, view: "voyage=body&dim=4&phi=0.6&feel=grief"}
    - file: voyage/03-the-way-in.md
      plates:
        - {id: wayin, view: "voyage=wayin&dim=4&phi=0.5"}
    - file: voyage/04-the-brain.md
      plates:
        - {id: brain, view: "voyage=brain&dim=8&phi=0.6"}
    - file: voyage/05-the-cathedral.md
      plates:
        - {id: cave-inside, view: "voyage=brain&dim=11&phi=0.6", acts: [cave]}
        - {id: cave-outside, view: "voyage=brain&dim=11&phi=0.6", acts: [cave, caveout]}
        - {id: cave-anatomy, view: "voyage=brain&dim=11&phi=0", acts: [cave]}
    - file: voyage/06-thoughts-as-avalanches.md
      plates:
        - {id: thoughts, view: "voyage=brain&dim=11&phi=0.6", acts: [thoughts], settle: 4000}
    - file: voyage/07-the-limbic-hinge.md
      plates:
        - {id: limbic, view: "voyage=limbic&dim=8&phi=0.6"}
    - file: voyage/08-emotion-and-thought.md
      plates:
        - {id: thought, view: "voyage=thought&dim=11&phi=0.6"}
    - file: voyage/09-one-neuron.md
      plates:
        - {id: neuron, view: "voyage=neuron&dim=8&phi=0.6"}
    - file: voyage/10-memory.md
      plates:
        - {id: memory, view: "voyage=network&dim=11&phi=0.5"}
    - file: voyage/11-the-landscape.md
      plates:
        - {id: landscape, view: "voyage=landscape&dim=11&phi=0.5"}
    - file: voyage/12-the-dyad.md
      plates:
        - {id: dyad, view: "voyage=dyad&dim=11&phi=0.4"}
    - file: voyage/13-the-path-of-a-thought.md
      plates:
        - {id: path, view: "voyage=tunnel&dim=8&phi=0.5"}
    - file: voyage/14-the-ureter.md
      plates:
        - {id: ureter-1, view: "voyage=ureter&dim=11&phi=0.5&uv=both&uo=1"}
        - {id: ureter-2, view: "voyage=ureter&dim=11&phi=0.5&uv=both&uo=2"}
        - {id: ureter-3, view: "voyage=ureter&dim=11&phi=0.5&uv=both&uo=3"}
        - {id: ureter-4, view: "voyage=ureter&dim=11&phi=0.5&uv=both&uo=4"}
        - {id: pain-path, view: "voyage=ureter&dim=11&phi=0.6", acts: [follow], settle: 9000}

front: [front/1-how-to-read.md, front/2-the-ladder.md]
theory:
  - theory/1-fields-and-waves.md
  - theory/2-greens-functions-and-propagators.md
  - theory/3-zoom-operator-and-scale.md
  - theory/4-eleven-dimensions-m-theory.md
  - theory/5-dark-sectors.md
  - theory/6-synthesis-response-grammar.md
  - theory/7-glossary.md
questions: true
time_axis:
  source: registry/eras.yaml
  placement: after-paths
back: [back/1-open-questions.md, back/2-glossary.md, back/3-sources-and-credits.md, back/4-colophon.md]
