# citeproc runs explicitly after the filters (see filters list)
citeproc: false
defaults:
  - ../../../lib/defaults/base-pdf.yaml
from: ../../../lib/format/visualize-reader.lua
metadata-file: textbook.yaml
input-files:
  - textbook.md
  - parts/0-toolkit.md
  - chapters/m1-numbers-units-scale.md
  - chapters/m2-change.md
  - chapters/m3-accumulation.md
  - chapters/m4-oscillation.md
  - chapters/m5-vectors-matrices.md
  - chapters/m6-chance.md
  - parts/1-response-grammar.md
  - chapters/01-fields-waves-scale.md
  - chapters/02-response-greens-resonance.md
  - chapters/03-frequencies.md
  - chapters/04-zooming.md
  - parts/2-ladder.md
  - chapters/05-atoms-quantum-scale.md
  - chapters/06-molecules-cells.md
  - chapters/07-human-level.md
  - chapters/08-two-people-groups.md
  - chapters/09-flocks-swarms.md
  - chapters/10-earth-deep-time-geology.md
  - chapters/11-stars-galaxies.md
  - chapters/12-cosmology-dark-sectors.md
  - parts/3-frontier.md
  - chapters/13-eleven-dimensions.md
  - chapters/14-dark-sectors.md
  - chapters/15-evidence-proof.md
  - appendices/0-appendices.md
  - appendices/A-units-constants.md
  - appendices/B-31-level-table.md
  - appendices/C-glossary.md
  - appendices/D-answer-key.md
  - appendices/E-figure-credits.md
  - appendices/F-atlas-crossref.md
  - appendices/Z-references.md
output-file: ../../../bld/textbook/ttheory-course.tex
to: latex
resource-path:
  - .
  - ../../..
bibliography: ../../../paper/bibliography.bib
csl: ../../../paper/apa-7th.csl
include-in-header:
  - templates/textbook-a4-header.tex
variables:
  geometry: a4paper,top=22mm,bottom=24mm,inner=24mm,outer=22mm
  fontsize: 11pt
  linestretch: 1.1
filters:
  - ../../../lib/format/registry.lua
  - ../../../lib/format/unicode-glyphs.lua
  - ../../../lib/format/programme-refs.lua
  - filters/atlas-crossref.lua
  - filters/course-numbering.lua
  - ../../../lib/format/visualize.lua
  - type: json
    path: pandoc-crossref
  - filters/textbook-layout.lua
  - ../../../lib/format/plates.lua
  - ../../../lib/format/columns.lua
  - filters/textbook-boxes.lua
  - type: citeproc
metadata:
  visualize-manifest: ../../../bld/textbook/visualize/manifest.json
  visualize-src: ../../../bld/textbook/visualize
  lean-root: ../../../paper/proofs
  programme-papers: ../../../registry/papers.yaml
