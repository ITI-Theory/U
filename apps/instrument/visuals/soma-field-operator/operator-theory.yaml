    - { id: dyad, visual_sigma: 9, catalogue_sigma: 10, band: III, kind: collective, composition: [core, joint, limb, node, link, field], transition_out: collective-alignment, visual_mode: dyadic-coupling, status: placeholder, provenance: sourced }
    - { id: swarm, visual_sigma: 10, catalogue_sigma: 11, band: III, kind: collective, composition: [node, link, field, contour], transition_out: network-institution, visual_mode: swarm, status: placeholder, provenance: sourced }
    - { id: community-city, visual_sigma: 11, catalogue_sigma: 12, band: IV, kind: network, composition: [node, link, boundary, field], transition_out: regional-constraint, visual_mode: network, status: placeholder, provenance: interpretive }
