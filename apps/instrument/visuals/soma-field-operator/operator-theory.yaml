  - "Each zoom level must change composition, camera framing, motion, labels, and ledger; labels alone are insufficient."
  - "Hierarchy control and zoom control remain independent axes."
  - "The current 4D/8D/11D organism scene is the sigma 8 visual mode, not the universal fallback."
  - "Add a Cheat Sheet drawer with source title, claim status, and deep link per selected scale/layer."
  - "Add a claim badge: FORMAL, SOURCED, or INTERPRETIVE."
  - "Replace the BRECVEMA overlay toggle with a selectable eight-mechanism inspector: full name, effect, affected parameter, field action, and highlighted route into L1."
  - "Use explicit transition states while a scene morphs between scales."

# Provisional implementation atlas. This is the one table that declares what
# can be displayed at each visual tick and how the next tick retypes it.
# `visual_sigma` is the existing 0-19 Three.js/theory-atlas coordinate.
# `catalogue_sigma` is the 1-20 pedagogical catalogue coordinate. They are
# deliberately both present until the application migrates to one resolver.
scale_atlas:
  coordinate_policy: "visual_sigma 0-19 maps to catalogue_sigma 1-20; canonical bands retain their declared sigma ranges."
  primitive_grammar: [core, shell, boundary, joint, limb, node, link, contour, orbit, volume, field]
  cardinality_kinds: [singular, population, collective, network, field]
  provenance_kinds: [formal, sourced, interpretive, placeholder]
  transition_rule: "Carry declared primitives forward only by retyping their relation; never imply literal anatomical identity across substrates."
  entries:
    - { id: quantum-foam, visual_sigma: 0, catalogue_sigma: 1, band: I, kind: field, composition: [field, contour, node], transition_out: compactification, visual_mode: quantum-lattice, status: implemented, provenance: sourced }
    - { id: string-boundary, visual_sigma: 1, catalogue_sigma: 2, band: I, kind: field, composition: [shell, field, node], transition_out: nuclear-binding, visual_mode: compactification, status: placeholder, provenance: sourced }
    - { id: nuclear, visual_sigma: 2, catalogue_sigma: 3, band: I, kind: singular, composition: [core, shell, node, field], transition_out: atomic-orbital, visual_mode: nuclear-shell, status: placeholder, provenance: sourced }
    - { id: atomic, visual_sigma: 3, catalogue_sigma: 4, band: I, kind: singular, composition: [core, shell, contour, field], transition_out: molecular-bond, visual_mode: orbital-field, status: placeholder, provenance: sourced }
    - { id: molecular, visual_sigma: 4, catalogue_sigma: 5, band: II, kind: population, composition: [node, link, contour, field], transition_out: cellular-boundary, visual_mode: molecular-network, status: placeholder, provenance: sourced }
    - { id: cell, visual_sigma: 5, catalogue_sigma: 6, band: II, kind: singular, composition: [boundary, shell, core, volume, joint, limb], transition_out: cellular-population, visual_mode: cell-field, status: implemented, provenance: interpretive }
    - { id: cellular-population, visual_sigma: 6, catalogue_sigma: 7, band: II, kind: population, composition: [boundary, core, volume, node, link, field], transition_out: organism-integration, visual_mode: circuit-field, status: placeholder, provenance: interpretive }
    - { id: organism, visual_sigma: 7, catalogue_sigma: 8, band: III, kind: singular, composition: [core, shell, joint, limb, field, contour], transition_out: coupled-organisms, visual_mode: brain-field, status: placeholder, provenance: sourced }
