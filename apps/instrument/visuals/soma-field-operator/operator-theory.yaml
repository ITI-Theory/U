# Operator Theory Contract
# Canonical data contract for the Soma Field Operator UI.
# PAPERS.yaml remains the publication registry; this file defines visual/theory navigation.

schema_version: 1
app:
  id: soma-field-operator
  role: "Interactive presentation and exploration layer above the [T]-Theory Cheat Sheets"
  scope: "Models the theory's stated structures and source links, not the universe itself"
  source_of_truth:
    - "paper/soma/ttheory-cheatsheet/ttheory-cheatsheet.md"
    - "Part2/fractal-programme/cheatsheets/"
  provenance_policy:
    formal: "Only statements linked to a paper/proof source may be labelled formal or verified."
    interpretive: "Cross-domain visual mappings are labelled interpretive hypotheses."
    clinical: "Human clinical vocabulary is never projected onto non-human scales without an explicit retyping note."

morphisms:
  zoom_operator:
    symbol: "Lambda_sigma"
    type: "Substrate(sigma) -> Substrate(sigma + 1)"
    inverse: "Pi_sigma: Substrate(sigma + 1) -> Substrate(sigma)"
    meaning: "Scale change preserves a declared structural invariant while retyping the substrate and observables."
    required_ui:
      - "Every step from sigma 0 through sigma 19 changes the scene, substrate, observable, and equation ledger."
      - "Forward and reverse controls expose the source and target scale explicitly."
      - "The UI never implies that human-scale variables retain their literal units at another scale."
  hierarchy_projection:
    symbol: "pi_11_to_8_to_4"
    type: "M11 -> M8 -> M4"
    meaning: "Complexity projection, independent of zoom."
    levels:
      M4: "physical spacetime substrate; body/worldline representation"
      M8: "M4 + P3 + L1; propagator plus regulation/attractor representation"
      M11: "M4 + P3 + L1 + C3; integrated cortex/matrix representation"

layers:
  M4:
    dimensions: "D1-4"
    label: "SPACETIME / SUBSTRATE"
    visual: "Grey wireframe or scale-specific material/worldline geometry"
    status: formal
  P3:
    dimensions: "D5-7"
    label: "PROPAGATOR / GREEN RESPONSE"
    visual: "One field-response volume, not multiple duplicate rings"
    status: formal
  L1:
    dimensions: "D8"
    label: "REGULATION / ATTRACTOR AXIS"
    visual: "Double-well potential, barrier depth, transition trajectory"
    status: formal_at_organism_scale
  C3:
    dimensions: "D9-11"
    label: "CORTEX / MATRIX GEOMETRY"
    visual: "Head-local fractal and matrix-spectrum geometry"
    status: formal_at_organism_scale

affect_operator:
  working_name: "BRECVEMA dynamics"
  terminology_status: pending_confirmation
  principle: "Affect dynamics may be rendered at every scale only after variables are retyped for that substrate."
  human_scale:
    status: sourced
    source: "P9 music-affect-dynamics and the Cheat Sheets"
    model: "Music-induced mechanisms act as forcing functions on a 16-dimensional soma-field state."
    state_space: "e(t) in [0,1]^16: eight somatic and eight cognitive affect-mode intensities."
    mechanisms:
      - {
          id: B,
          name: "Brainstem reflex",
          effect: "Fast sensory salience forcing",
          parameter: "J(t)",
          field_action: "Injects a transient source into the field",
        }
      - {
          id: R,
          name: "Rhythmic entrainment",
          effect: "Synchronisation with periodic drive",
          parameter: "gamma",
          field_action: "Modulates damping and phase locking",
        }
      - {
          id: E1,
          name: "Evaluative conditioning",
          effect: "Learned cue association",
          parameter: "b",
          field_action: "Shifts the attractor bias vector",
        }
      - {
          id: C,
          name: "Emotional contagion",
          effect: "Interpersonal coupling",
          parameter: "kappa",
          field_action: "Changes coupling to an external field",
        }
      - {
          id: V,
          name: "Visual imagery",
          effect: "Internally generated representation",
          parameter: "J_internal(t)",
          field_action: "Adds an endogenous source trajectory",
        }
      - {
          id: E2,
          name: "Episodic memory",
          effect: "Past event reactivation",
          parameter: "K(tau)",
          field_action: "Reweights the memory kernel",
        }
      - {
          id: M,
          name: "Musical expectancy",
          effect: "Anticipated resolution or violation",
          parameter: "Delta V",
          field_action: "Creates transient wells and barriers",
        }
      - {
          id: A,
          name: "Aesthetic judgement",
          effect: "Appraisal of form and value",
          parameter: "b",
          field_action: "Shifts the cognitive bias vector",
        }
    controls:
      - "BreCVEMA mechanism channels"
      - "attractor depth"
      - "field temperature"
      - "coupling / entrainment"
  cross_scale:
    status: interpretive_hypothesis
    guardrail: "Do not claim that a city, planet, or universe has human emotions. Render homologous regulation, memory, coupling, and attractor dynamics instead."
    ui_mode: "AFFECT DYNAMICS: OFF | INTERPRETIVE | HUMAN-CLINICAL"
    modes:
      off: "Hides affect overlay; formal field/scale information remains visible."
      interpretive: "Shows retyped dynamics: stability, forcing, memory, coupling, and attractor transitions at the selected scale."
      human_clinical: "Available only at declared organism/clinical scales; exposes BRECVEMA labels and clinical language."

