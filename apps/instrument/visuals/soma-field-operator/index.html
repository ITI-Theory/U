<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soma Field Operator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <canvas id="operator" aria-label="Soma Field Operator visual"></canvas>
      <section class="field-readout" aria-label="Field controls">
        <p class="eyebrow">[T] / SOMA FIELD OPERATOR</p>
        <h1>11D BODY MAP</h1>
        <div class="control"><label for="somatic">SOMATIC</label><input id="somatic" type="range" min="0" max="1" value="0.72" step="0.01" /></div>
        <div class="control"><label for="limbic">LIMBIC</label><input id="limbic" type="range" min="0" max="1" value="0.86" step="0.01" /></div>
        <div class="control"><label for="cognitive">COGNITIVE</label><input id="cognitive" type="range" min="0" max="1" value="0.46" step="0.01" /></div>
        <div class="control scale-control"><label for="scale">ZOOM OPERATOR</label><input id="scale" type="range" min="0" max="19" value="7" step="1" /></div>
        <output id="scale-readout" class="scale-readout">SIGMA 07 / ORGANISM</output>
        <button id="brecvema" class="mode-button" type="button" aria-pressed="false">BRECVEMA / P.N.S.</button>
        <section class="math-readout" aria-live="polite">
          <p id="equation-title">ACTIVE FIELD EQUATION</p>
          <code id="equation-primary">(NABLA^2 + k^2) G = DELTA</code>
          <code id="equation-secondary">M11 = M4 x P3 x L1 x C3</code>
        </section>
        <button id="export" type="button">EXPORT FRAME</button>
      </section>
      <p class="field-note">BODY: D1-4 / NERVES: D5-7 / LIMBIC: D8 / MIND: D9-11 / EMF: WHOLE-BODY GREEN RESPONSE</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
