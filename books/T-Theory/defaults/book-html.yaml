from: markdown+raw_tex+tex_math_dollars+yaml_metadata_block+pipe_tables+table_captions+implicit_figures
to: html5
standalone: true
embed-resources: true
html-math-method: mathjax
eol: lf
css: ../../lib/format/site.css
resource-path:
  - .
  - ../../paper
filters:
  - filters/ttheory-direct.lua
  - ../../paper/filters/strip-keywords.lua
  - ../../lib/format/macros.lua
  - ../../lib/format/unicode-glyphs.lua
  - ../../lib/format/programme-refs.lua
  - type: citeproc
# citeproc runs explicitly after the filters (see filters list)
citeproc: false
bibliography: ../../paper/bibliography.bib
csl: ../../paper/apa-7th.csl
metadata:
  programme-papers: ../../registry/papers.yaml
