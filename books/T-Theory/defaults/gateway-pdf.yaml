from: markdown+raw_tex+tex_math_dollars+yaml_metadata_block+pipe_tables+table_captions+implicit_figures
standalone: true
pdf-engine: xelatex
eol: lf
toc: true
toc-depth: 2
resource-path:
  - .
  - ../../paper
variables:
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  monofont: Latin Modern Mono
  geometry: a4paper,twoside,inner=22mm,outer=20mm,top=20mm,bottom=22mm
  fontsize: 11pt
  linestretch: 1.4
  header-includes: |
    \usepackage{amsmath}\usepackage{amssymb}
highlight-style: tango
include-in-header:
  - ../../paper/journal.tex
  - ttheory-titlepage.tex
  - ttheory-packages.tex
filters:
  - filters/ttheory-direct.lua
  - ../../paper/filters/strip-keywords.lua
  - ../../lib/format/macros.lua
  - ../../lib/format/unicode-glyphs.lua
  - ../../lib/format/programme-refs.lua
  - type: citeproc
  - ../../lib/format/breakable-tokens.lua
# citeproc runs explicitly after the filters (see filters list)
citeproc: false
bibliography: ../../paper/bibliography.bib
csl: ../../paper/apa-7th.csl
template: format/gateway-template.tex
metadata:
  programme-papers: ../../registry/papers.yaml
