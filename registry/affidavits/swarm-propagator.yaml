    kind: internal-duplicate-mismatch
    finding: >-
      the paper states two different worst-case growth orders for the number
      of communication rounds K: "K = O(N) in the worst case" (lines 37-38)
      for bounded-degree swarms, then separately derives "in the worst case"
      (line 90) a classical total cost of O(N^3 log(1/eps)) from "K =
      O(N^2 log(1/eps))" rounds (line 88) for the common sparse-graph case —
      exponent 1 versus exponent 2 for the same worst-case quantity K, and a
      common-case bound that is asymptotically larger than the stated
      worst-case bound
    verdict: contradicted
    label: kernel-verified
    lean: null
