      type, indices 0..19), but the same paragraph's own Zoom Operator row gives
      $\sigma \in \{0,\ldots,20\}$ (21 values) and the cosmological-scale example
      a few lines earlier explicitly uses $\sigma = 19$--$20$, an index outside
      Scale_20's range, so the paper's two statements of the scale count disagree
      by one (20 vs 21)
    verdict: contradicted
