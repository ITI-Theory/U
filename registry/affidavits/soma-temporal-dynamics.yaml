      - {quantity: Temporal-CosmologicalScaleIndexMin, value: 19}
      - {quantity: Temporal-CosmologicalScaleIndexMax, value: 20}
      - {quantity: Temporal-GeologicalMemoryTimescaleMinYears, value: 1000}
      - {quantity: Temporal-GeologicalMemoryTimescaleMaxYears, value: 1000000}
      - {quantity: Temporal-CosmologicalMemoryTimescaleYears, value: 10000000000}
    disposition: none
  - id: T7
    quote: the escape time grows exponentially with the barrier-to-diffusion ratio
    lines: [252, 254]
    kind: internal-arithmetic
    finding: >-
      the figure's plotted function $f=2\pi\,e^{x}$ (caption states
      $\omega_A\omega_B=1$) matches the Kramers formula
      $\langle T\rangle = (2\pi/\omega_A\omega_B)\,e^{\Delta V/D}$ reduced at that
      value, and is nondecreasing at $x=\Delta V/D=0,1,2$
      ($2\pi\approx6.283$, $2\pi e\approx17.079$, $2\pi e^2\approx46.427$),
      confirming the caption's "grows exponentially" claim
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: monotone, args: [6.283185307, 17.079468445, 46.426808715]}]
    values:
      - {quantity: Temporal-KramersOmegaProductCaption, value: 1}
    disposition: none
  - id: T8
    quote: \delta^4(x-x')
    lines: [117, 510]
    kind: internal-count
    finding: >-
      the Unified Kinematic Picture table abbreviates the retarded propagator's
      source as $\delta^4(x-x')$, matching the explicit equation given earlier,
      $\delta^{(3)}(x-x')\,\delta(t-t')$: 3 spatial delta dimensions plus 1
      temporal delta dimension is 4, as the shorthand exponent states
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: sum, args: [3, 1, 4]}]
    values:
      - {quantity: Temporal-PropagatorSpacetimeDimensionCount, value: 4}
    disposition: none

