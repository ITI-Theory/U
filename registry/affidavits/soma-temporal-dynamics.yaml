      $\ell = v_s\,\tau_m$ exactly, e.g. at illustrative $k=1/4$, $v_s=8$:
      $\ell=4$ and $v_s\,\tau_m = 8\times(1/2) = 4$
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: diff, args: [4, 4, 0]}]
    disposition: none
  - id: T5
    quote: seconds to minutes
    lines: [184, 190, 196]
    kind: internal-arithmetic
    finding: >-
      the paper's three qualitative memory regimes are given in increasing
      timescale order — short-term ($\tau_m \sim$ seconds to minutes), medium-term
      ($\tau_m \sim$ hours to days), long-term ($\tau_m \sim$ months to years) —
      consistent with representative lower-bound durations (1 s, 1 hour = 3600 s,
      1 month $\approx$ 2,592,000 s) being nondecreasing
    verdict: consistent
    label: kernel-verified
    lean: null
    check: [{template: monotone, args: [1, 3600, 2592000]}]
    disposition: none
  - id: T6
    quote: '\tau_m \sim 10^3$ to $10^6$ years'
    lines: [422, 424, 429, 431]
    kind: internal-arithmetic
    finding: >-
      the geological-scale memory timescale ($\sigma=10$, $\tau_m \sim 10^3$ to
      $10^6$ years) and the cosmological-scale memory timescale ($\sigma=19$--$20$,
      the Hubble time $\sim 10^{10}$ years) are nondecreasing with scale index, as
      required by the paper's own claim that larger scale (smaller $k$) means
      longer memory
    verdict: consistent
    label: kernel-verified
    lean: null
    check: [{template: monotone, args: [1000, 1000000, 10000000000]}]
