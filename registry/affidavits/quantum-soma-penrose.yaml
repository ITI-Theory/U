    disposition: none
  - id: Q9
    quote: 'upper bound on the cold-classical success rate is 1.9%'
    lines: [317, 318, 339, 340, 341, 343]
    kind: internal-arithmetic
    finding: >-
      the stated Wilson 95% confidence interval upper bound, 0.019 (quoted
      identically in the Limitations text and all three B8/B10/B12 bootstrap
      table rows), equals the "1.9%" figure given immediately afterwards
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: eq, args: [0.019, 19/1000]}]
    values:
      - {quantity: QSoma-ClassicalCIUpperBoundPercent, value: 1.9}
    disposition: none
  - id: Q10
    quote: 'narrows monotonically with barrier strength'
    lines: [364, 365]
    kind: internal-arithmetic
    finding: >-
      the three quoted spectral-gap values for increasing barrier strength
      (B8: 0.0095, B10: 0.0089, B12: 0.0085) are monotonically decreasing,
      matching the claim that the gap "narrows monotonically with barrier
      strength" (checked as the reverse sequence 0.0085, 0.0089, 0.0095 being
      nondecreasing)
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: monotone, args: [0.0085, 0.0089, 0.0095]}]
    values:
      - {quantity: QSoma-SpectralGapB8, value: 0.0095}
      - {quantity: QSoma-SpectralGapB10, value: 0.0089}
      - {quantity: QSoma-SpectralGapB12, value: 0.0085}
    disposition: none
  - id: Q11
    quote: 'rises monotonically with barrier strength'
    lines: [172, 174, 182, 184, 186]
    kind: internal-arithmetic
    finding: >-
      the Noise-Equivalence-Curve table's nine $T^*$ values, read in the order
      given (barrier strength $-6$ down to $-14$), are nondecreasing
      (0.094, 0.101, 0.107, 0.112, 0.117, 0.120, 0.124, 0.127, 0.129), matching
      the text's claim that "$T^*$ rises monotonically with barrier strength"
      and the Visualize block's own count of 9 pairs
    verdict: confirmed
    label: kernel-verified
    lean: null
    check:
      - {template: monotone, args: [0.094, 0.101, 0.107, 0.112, 0.117, 0.120, 0.124, 0.127, 0.129]}
    values:
      - {quantity: QSoma-NoiseEquivalencePointCount, value: 9}
    disposition: none
  - id: Q12
    quote: 'stays in Awe: 16/16 (100%)'
    lines: [349, 355]
    kind: internal-arithmetic
    finding: >-
      both pre-registered negative controls report 16 out of 16 classical-cold
      runs matching the predicted outcome (Control A, barrier intact: stays in
      Awe 16/16; Control B, barrier removed: reaches Awe 16/16), each correctly
      arithmetically equal to the stated "100%"
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: eq, args: [16/16, 1]}]
    values:
      - {quantity: QSoma-ControlASuccessRate, value: "16/16"}
      - {quantity: QSoma-ControlBSuccessRate, value: "16/16"}
    disposition: none

