claims:
  - id: Q1
    quote: '0/200 (0.000)'
    lines: [335, 339, 340, 341]
    kind: cross-paper
    finding: >-
      P11, P12, P13 and the thesis preamble cite this paper for QUANT-EXP-1 as 'classical
      0/48, quantum 3/3': those are the 20 May sweep (16 seeds x 3 barriers; quantum
      Awe-dominant in 3 of 3 barrier cases, QUANT-EXP-SWEEP-2026-05-20.md); this paper
      reports the hardened rerun, 0/200 per barrier (0/600 in all), and gives neither
      0/48 nor 3/3: the citations name the wrong run
    verdict: contradicted
    label: kernel-verified
    lean: null
    check: [{template: sum, args: [16, 16, 16, 48]}, {template: ne, args: [48, 600]}]
    values:
      - {quantity: FMHN-ReachabilityClassicalSuccessRate, value: "0/200"}
      - {quantity: QSoma-ClassicalTrialsTotal, value: 600}
    disposition: open
  - id: Q2
    quote: 'reported in §10.1'
    lines: [304, 320, 324]
    kind: internal-duplicate-mismatch
    finding: >-
      the Pre-Registered Hardening Protocol subsection cross-references itself
      twice as "(§10.1)" (lines 320, 324), but counting the paper's own top-level
      headings (Introduction=1 through References=12) that subsection lives
      inside section 9, "Limitations, Controls, and Claim Boundaries", not
      section 10 — the self-reference is one section number too high (and an
      earlier forward reference to "the supplementary data archive" as "§11",
      line 191, likewise does not land on any section with that content;
      actual section 11 is Acknowledgements)
    verdict: contradicted
    label: kernel-verified
    lean: null
    check: [{template: diff, args: [10, 9, 1]}]
    values:
      - {quantity: QSoma-LimitationsSectionNumberStated, value: 10}
      - {quantity: QSoma-LimitationsSectionNumberActual, value: 9}
    disposition: open
  - id: Q3
    quote: 'reaches a maximum of $+1.025$ at'
    lines: [152, 153, 154, 156]
    kind: internal-arithmetic
    finding: >-
      recomputing the stated barrier interpolation $H(\lambda) = -10\lambda^2 +
      9\lambda - 1$ at its own quoted vertex $\lambda = 0.45 = 9/20$ gives
      $H(0.45) = 41/40 = 1.025$ exactly, and the barrier height above the Fear
      basin $H(0) = -1$ is $1.025 - (-1) = 2.025$, matching both numbers the text
      states
    verdict: confirmed
    label: kernel-verified
    lean: null
    check:
      - {template: eq, args: [9/20, 0.45]}
      - {template: diff, args: [1.025, -1, 2.025]}
    values:
      - {quantity: QSoma-BarrierHeight, value: 2.025}
      - {quantity: QSoma-BarrierPeakLambda, value: 0.45}
    disposition: none
  - id: Q4
    quote: 'e^{-101} \approx 0'
    lines: [160]
    kind: internal-arithmetic
    finding: >-
      the cold-classical "STUCK" row's own cited transition-probability figure
      $e^{-101} \approx 1.4\times10^{-44}$, well under $10^{-40}$, which is
      consistent with the row's "$\approx 0$" label
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: lt, args: [1.4e-44, 1e-40]}]
    disposition: none
  - id: Q5
    quote: 'Quantum peak: 0.408'
    lines: [162, 178, 340, 349]
    kind: internal-duplicate-mismatch
    finding: >-
      the quantum peak Awe-dominant occupancy at $W[\mathrm{Fear},\mathrm{Awe}]
      = -10$ is quoted identically as 0.408 in four separate places — the main
      results table, the noise-equivalence-curve table's $-10$ row, the
      pre-registered bootstrap table's B10 row, and Negative Control A — a
      figure recomputed four times across the paper that never drifts
    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: eq, args: [0.408, 0.408]}]
    values:
      - {quantity: QSoma-QuantumPeakOccupancyW10, value: 0.408}
    disposition: none
  - id: Q6
    quote: '2^8 = 256'
    lines: [140]
    kind: internal-arithmetic
    finding: >-
      the stated 8-qubit Hilbert space dimension $2^8 = 256$ is arithmetically
      exact, matching the paper's own description of a dense statevector
