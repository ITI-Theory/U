    verdict: confirmed
    label: kernel-verified
    lean: null
    check: [{template: eq, args: [256, 256]}]
    values:
      - {quantity: QSoma-HilbertSpaceDimension, value: 256}
    disposition: none
  - id: Q7
    quote: 'B12 (W = −12)'
    lines: [339, 340, 341]
    kind: cross-paper
    finding: >-
      this paper's headline pre-registered protocol tests exactly three barrier
      strengths in increasing order, B8, B10, B12 (|W| = 8, 10, 12), whose
      maximum, 12, matches the value used elsewhere (missing-limbic-layer) as
      "QUANT-EXP-1 maximum barrier" (FMHN-CptsdBarrierW = 12)
    verdict: consistent
    label: kernel-verified
    lean: null
    check:
      - {template: monotone, args: [8, 10, 12]}
      - {template: eq, args: [12, 12]}
    values:
      - {quantity: FMHN-CptsdBarrierW, value: 12}
    disposition: none
  - id: Q8
    quote: 'under five seconds'
    lines: [18, 19, 143, 144]
    kind: internal-duplicate-mismatch
    finding: >-
      the abstract's claim of running "in under five seconds on commodity
      hardware" (lines 18-19) is consistent with the Setup list's more precise
      figure of "$\approx 4$ seconds on commodity CPU" (line 144): 4 < 5
    verdict: consistent
    label: kernel-verified
    lean: null
    check: [{template: lt, args: [4, 5]}]
    values:
