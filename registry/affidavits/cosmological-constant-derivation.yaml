# TYPING: "the cosmological constant is the steady background amplitude of
#   the somatic field of the empty universe" (line ~262, interpretive image,
#   explicitly labelled `interpretive` by the paper itself) and "A classical
#   background condensate... has w = p/rho = -1" (line ~288) assert physical
#   identities between a field-theoretic amplitude and a cosmological
#   constant/equation-of-state; OpenCyc typing would check whether a
#   CosmologicalConstant and a FieldAmplitude can be read as the same kind
#   of thing, or only as corresponding under the paper's own assumptions.
# TYPING: "the field equation $(\nabla^2+k^2)G=\delta(x-x')$... Its stable
#   vacuum state is the regulated attractor of the 11-dimensional field"
#   (lines 42-50) analogises a cosmological vacuum expectation value to
#   condensed-matter Green-function attractors; worth an opencyc-typing
#   mapping (PhysicalAmplitude vs CosmologicalConstant vs VacuumState).
# LEAN: the Formal Status table (lines ~208-219) cites `omega_lambda_fraction`,
#   `omega_lambda_discrepancy_small`, `cosmological_constant_identification`,
#   `cosmological_correspondence`, `geometricFlow_waveEquation` as proved (two
#   of them explicitly "weak form"), `calabi_yau_rg_coefficients` as an axiom,
#   `universe_is_11D_organism` as a definition, and `usf_equation_of_state` as
#   a "type-level placeholder" whose physics is admittedly not formalised.
#   These are ledger claims (axiom/proved/sorry against the actual Lean), to
#   be checked by `make -C sherlock ledger`, not by the registry's arithmetic
#   templates.
# LEAN: "Mathlib's differential geometry infrastructure... is approaching
#   readiness; the linearised GR result is on the Mathlib roadmap" (lines
#   ~222-224) is a claim about Mathlib's own status, not this programme's
#   Lean; not ledger-checkable here.
  - id: L12
