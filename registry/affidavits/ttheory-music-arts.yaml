- id: A2
  quote: 'The rest of this book proceeds in three movements. First, it examines BRECVEMA and related music-psychological mechanisms as dynamical field operations. Second, it turns to composition, performance, and the art of attractor traversal. Third, it describes the Soma Machine and [T]-Theory practice as a labelled experimental art form: one that can produce objects, interfaces, performances, and hypotheses without pretending that all of them have the same evidence status. The conclusion returns to the practical question for composers and artists: not "what emotion is this?", but "what trajectory am I asking a body to traverse?" `interpretive`.'
