- id: A6
  quote: One useful falsification test is cross-mechanism substitution. If a piece said to work through expectancy still produces the same trajectory when expectation is neutralised but memory cues remain, the mechanism assignment is wrong. If a groove effect remains when the pulse is removed but timbre and genre cues remain, entrainment was not the main route. If a claimed brainstem-reflex response depends on knowing the performer, it is not primarily brainstem. The model should welcome such substitutions because they distinguish route from outcome `open-hypothesis`.
