  quote: 'For empirical work, the separation suggests factorial designs: stable pulse with expected harmony, stable pulse with violated harmony, unstable pulse with expected harmony, unstable pulse with violated harmony. Add movement permission as another factor, because entrainment can be suppressed by task constraints. The predicted response patterns should differ in phase locking, reported tension, transition timing, and post-event appraisal. If all four conditions collapse into a single arousal score, the field model adds little; if they separate in trajectory space, it earns its keep `open-hypothesis`.'
