- id: A5
  quote: 'The three readings teach epistemic scale. In 4D, the selected human system is treated as body, nervous system, acoustics, movement, and ordinary time. This is the baseline of measurable substrate. In 8D, the same system becomes a response system with a declared forcing term and propagator. The visual action is "poke": introduce a disturbance and show propagation. In 11D, the display adds integration and meaning: body, propagator, limbic axis, cortex or matrix layer, threshold, and reportable percept. The machine thereby teaches interpretation as a controlled addition, not as a replacement for physical description `interpretive`.'
