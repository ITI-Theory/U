- id: A4
  quote: The simplest compositional operation is basin deepening. Repetition, tonal centring, rhythmic stability, timbral consistency, and registral anchoring can make a state feel more stable. In the field notation this means the trajectory is encouraged to remain near a local minimum. Minimalist process, drone, groove, chant, lullaby, and certain ambient practices all exploit basin deepening in different ways. The emotional result need not be calm. A deep basin may be ecstatic, obsessive, martial, melancholic, suspended, or dissociative depending on the coupling matrix and cultural frame `interpretive`.
