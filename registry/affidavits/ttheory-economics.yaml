- id: E8
  quote: 'A careful validation ladder would have five rungs. Rung one is formal: prove the exact potential-game correspondence and publish counterexamples. Rung two is computational: simulate known landscapes and show that the proposed estimators recover basin structure, barriers, and transition probabilities. Rung three is laboratory: test equilibrium selection and switching in controlled games. Rung four is institutional: apply the model to observed rule changes or market microstructure with pre-registered predictions. Rung five is comparative: show that the field model outperforms established economic baselines in a domain where the extra complexity is justified. `open-hypothesis`'
