- id: E5
  quote: The second step is to define the state vector. In a limit-order-book study the state might include bid and ask depth at several levels, order arrival rates, cancellation rates, signed order flow, short-horizon volatility, and inventory proxies. In a funding-network study it might include haircuts, maturities, collateral classes, counterparty exposures, rollover rates, and liquidity buffers. In a portfolio-overlap study it might include holdings, leverage, redemption pressure, and covariance of liquidation demand. These choices are substantive economics, not data plumbing. `derived-under-assumptions`
