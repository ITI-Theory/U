- id: E4
  quote: 'A future economics anchor paper should begin with definitions rather than analogies. Define a finite player set, finite action sets, payoff functions, and the unilateral-deviation graph on pure profiles. Define exact potential, ordinal potential, and weighted potential. Define Hopfield energy on the same graph as $H=-\Phi$ where $\Phi$ exists. Then prove: a pure profile is a Nash equilibrium if and only if it is a local minimum of $H$ on the unilateral-deviation graph. This theorem is short, but it is the hinge on which the exact claim turns. `derived-under-assumptions`'
