- id: E7
  quote: 'The strongest immediate research path is theorem-first. Formalise the Nash--Hopfield claim for finite exact potential games. State the profile neighbourhood. Prove local equivalence. Extend to weighted and ordinal potential games with appropriate weakening. Give counterexamples: matching pennies, rock--paper--scissors, and games with antisymmetric payoff components. Then connect stochastic best-response dynamics to Gibbs-like stationary distributions where standard assumptions allow. This would turn the anchor slogan into a mathematical contribution. `open-hypothesis`'
