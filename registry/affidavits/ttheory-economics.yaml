- id: E3
  quote: 'This gives a practical classification table for future work. Class A: exact potential games, where Hopfield energy is exact after sign change. Class B: near-potential games, where the potential component dominates but cyclic components may matter. Class C: non-potential games, where energy language is analogy or decomposition only. Class D: saddle and Hamiltonian strategic systems, where a different field operator is needed. Class E: institutional mechanisms that intentionally transform a game from one class to another. The economics volume''s strongest claims live in Class A and carefully labelled parts of Class B. `interpretive`'
