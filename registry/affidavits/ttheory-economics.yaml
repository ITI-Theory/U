- id: E2
  quote: One possible contribution is the common treatment of metastability. A DSGE model may have occasionally binding constraints; an industrial-organisation model may have entry deterrence; a finance model may have liquidity spirals; a game-learning model may have convention lock-in. Each involves persistence that is not simply equilibrium. Energy landscapes, barriers, and noise provide a cross-domain way to discuss why systems remain where they are and what scale of perturbation changes them. But the underlying equations remain domain-specific. `interpretive`
