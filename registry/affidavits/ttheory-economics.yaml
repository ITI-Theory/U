claims:
- id: E1
  quote: 'The volume therefore proceeds by separation. First, it identifies the exact mathematical cases: exact potential games, symmetric pairwise-interaction games, and Hopfield networks with Lyapunov energy. Second, it discusses analogous but non-exact cases: general games, markets with strategic feedback, financial networks with endogenous leverage, and heterogeneous-agent dynamics. Third, it asks how the programme''s simulation and proof surfaces bear on economics. The answer is cautious. Lean theorems about complexity, WKB reachability, and formal encodings are real facts about their definitions; QUANT-EXP-1 is an exact statevector simulation; the economic claims in this volume are mostly derived under assumptions or open hypotheses. `interpretive`'
