- id: E6
  quote: A mechanism-design translation should ask five questions before drawing any energy diagram. First, what behaviour is intended to be stable? Truthful reporting, efficient matching, cooperation, liquidity provision, entry, innovation, or restraint are different target basins. Second, what deviations are locally profitable? The neighbourhood relation might be unilateral misreporting, bilateral blocking, coalition deviation, withdrawal, collusion, or manipulation of an algorithm. Third, what makes the target basin robust? It may be dominant strategy incentives, repeated-game punishment, reputation, verification, collateral, or legal sanction. Fourth, what undesirable basins remain? Fifth, who bears the cost of making the desired basin deep? `interpretive`
