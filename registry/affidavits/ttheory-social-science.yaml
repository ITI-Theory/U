- id: S9
  quote: The social-science volume should adopt several house rules. First, never infer ontology from formal resemblance alone. A dialect wave, a flock, a therapeutic dyad, and an institutional crisis may all be modelled with propagators, but they do not share one substrate in any socially meaningful sense until measurement says so. The safest default is analogy or modelling transfer; co-identification must be earned case by case `interpretive`.
