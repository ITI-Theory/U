- id: S3
  quote: 'A practical research design would compare four models on the same case: a baseline demographic model, a network contagion model, a bounded-confidence or threshold model, and the [T]-Theory kernel model with explicit geography and coupling. The case might be a dialect feature, a health practice, a protest frame, or an organisational routine. The programme''s model would need to improve out-of-sample prediction and produce interpretable parameters. Otherwise it remains a metaphor `open-hypothesis`.'
