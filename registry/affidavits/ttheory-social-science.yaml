- id: S7
  quote: The first teaching principle is to distinguish **state**, **coupling**, **threshold**, **memory**, and **boundary**. State is what changes. Coupling is who or what can affect it. Threshold is how much input is needed. Memory is how the past remains active. Boundary is what blocks, channels, or transforms propagation. Students can apply this five-part frame to cases before seeing any equation. The mathematics then names relations they have already analysed `interpretive`.
