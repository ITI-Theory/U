- id: S2
  quote: 'The six embedded papers in this volume should be read in that spirit. The geographic paper supplies spatial examples: dialect diffusion, parakeet collective motion, and valley resonance. The swarm paper supplies a computational coordination claim: a Green''s-function matrix product can outperform iterative message passing when the number of rounds $K$ exceeds the number of agents $N$ [@johnsonswarm2026]. The social-intelligence paper supplies the dyadic formalism: $W_{AB}$, the dyadic propagator, Arnold tongues, and SQ. The Gestalt paper supplies an interpretive bridge between field dynamics, perception, and neutral-monist philosophy. The synthesis and Soma-Field papers provide the programme''s core machinery and its evidence boundaries.'
