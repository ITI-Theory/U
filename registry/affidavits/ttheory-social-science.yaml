- id: S10
  quote: The first empirical programme should be narrow. Begin with dyads, because dyads are measurable. Estimate coupling and synchrony across conversation, cooperation, conflict, and repair. Compare dyadic spectral measures with rapport ratings and behavioural outcomes. Include neurodivergent participants in designs that respect sensory and social preferences. Publish null results. Only then scale to groups, organisations, and cities `open-hypothesis`.
