- id: S8
  quote: 'The social extension begins mostly as interpretation and open hypothesis. To promote a claim, the programme should require staged evidence. Stage one: formal clarity. The operator, state variables, assumptions, and predicted observables are specified. Stage two: measurement feasibility. The variables can be estimated reliably and ethically. Stage three: model comparison. The field model outperforms or usefully complements alternatives. Stage four: independent replication. Other teams reproduce the result in new settings `open-hypothesis`.'
