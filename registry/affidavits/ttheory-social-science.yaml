- id: S6
  quote: 'A careful reader should reject three tempting versions of the social-field claim. The first is **total reduction**: the idea that because social actors have bodies, sociology can be replaced by physiology. This is false. Bodies are always situated in language, role, institution, economy, and history. Physiological coupling may help explain how a conversation feels or how a crowd entrains, but it cannot by itself explain why a legal category exists, why a class relation persists, or why a symbol carries authority `interpretive`.'
