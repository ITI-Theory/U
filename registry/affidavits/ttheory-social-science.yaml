- id: S4
  quote: 'For rapport, the minimum operational package should include at least three layers. First, bodily synchrony: respiration, heart-rate variability, movement, speech rhythm, gaze, and prosody. Second, interactional performance: turn-taking smoothness, repair after interruption, joint-task success, and conversational satisfaction. Third, subjective and relational report: perceived understanding, comfort, safety, mutuality, and desire for future interaction. The dyadic propagator should be tested against all three, because synchrony without felt safety is not rapport `open-hypothesis`.'
