- id: G3
  quote: The first proposed test concerns WKB-like nucleation in controlled systems. Natural earthquakes are difficult because the state is poorly observed and recurrence is slow. Laboratory stick-slip experiments, biaxial fault apparatus, rotary shear, and acoustic-emission monitored rock failure offer better initial targets. There one can control normal stress, loading rate, pore pressure, roughness, temperature, and material; record acoustic emissions; image deformation; and observe repeated failures. A reaction coordinate $q$ could be learned from the experiment, and an action-like variable could be tested against failure probability. Success in the lab would not prove natural prediction, but failure in the lab would be informative.
