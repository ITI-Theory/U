- id: G1
  quote: The book's answer is deliberately tiered. At the first tier, the contact is ordinary mathematics. The elastodynamic Green's tensor $G_{ij}(x,t;x',t')$ is the displacement in direction $i$ at $x,t$ caused by an impulsive unit force in direction $j$ at $x',t'$, subject to the medium's density, elastic moduli, attenuation, anisotropy, interfaces, and boundary conditions. This is a genuine equation-level contact with the programme's master propagator `derived-under-assumptions`. A seismologist does not need a new ontology to recognise it.
