- id: G5
  quote: The strongest conclusion is therefore not that [T]-Theory has derived earthquake prediction. It has not. The strongest conclusion is that geophysics offers one of the programme's best tests because the propagator is already real in the field's mathematics `derived-under-assumptions`. A seismic Green's tensor is an impulse response. A site-response function is boundary-conditioned propagation. A tomographic sensitivity kernel is a response of data to structure. An ambient-noise correlation can approximate an interstation Green's function. These are not borrowed metaphors. They are points where the programme must match an existing technical discipline.
