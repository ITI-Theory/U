- id: G6
  quote: The practical research path is staged. First, translate the programme's variables into rate-and-state, fracture, and elastic language. Second, test rare-transition action laws in laboratory stick-slip and acoustic-emission systems. Third, test induced-seismicity catalogues where forcing is partly known. Fourth, examine b-value, Omori, and aftershock-kernel predictions against strict null models. Fifth, attempt natural tectonic applications only when the smaller systems have constrained the parameters. Sixth, publish failures as carefully as successes. A programme that claims universality should welcome hard local tests.
