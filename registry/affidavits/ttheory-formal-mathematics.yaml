  quote: 'The formal proof status is not an administrative detail appended to the science. In this repository it is itself mathematical content. The same English phrase can name at least five different proof situations: a definitional equality, an elementary arithmetic theorem, an imported library theorem, an axiom, or an unfinished proof. A reader who collapses those situations will misunderstand the programme even if every formula is copied correctly.'
