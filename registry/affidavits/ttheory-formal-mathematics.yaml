- id: M1
  quote: 'The central mathematical task is to distinguish four levels. First, there are definitions: `ScaleLevel := Fin 21`; `consciousnessThreshold : Real := Real.sqrt 2`; `isConscious phi := consciousnessThreshold <= phi`; `Spacetime4D := Fin 4 -> Real`; `CompactX7 := PropagatorSpace3D x LimbicAxis1D x CortexSpace3D`. Second, there are by-definition or elementary consequences: `consciousness_dichotomy` is `lt_or_ge phi consciousnessThreshold`; `threshold_positive` follows from positivity of a square root; `volitional_is_autonomous_when_zero` is a `simp` proof about adding zero. Third, there are substantive imported-library applications, such as Physlib''s harmonic oscillator and wave-equation results in `MTheoryIsomorphism.lean`, Mathlib''s Hermitian spectral machinery in `SomaField.lean`, and OSforGFF''s Osterwalder-Schrader theorem in `USF_OSAxioms.lean`. Fourth, there are assumptions, placeholders, and unfinished proofs. The mathematics begins when these levels stop being blurred.'
