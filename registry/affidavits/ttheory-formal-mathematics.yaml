- id: M4
  quote: 'The project-wide `sorry` count matters because generated wrappers have previously said there were no active sorries. A direct source audit finds five real `sorry`s, in `BRECVEMAVariational.lean` (two), `DyadicField.lean` (two), and `SomaNetwork.lean` (one). There are also many axioms outside `FieldAxioms.lean`: for example `quant_exp_1` in `LimbicTunnel.lean`, `greens_achieves_minimum_energy` in `SwarmPropagator.lean`, local GR and geometry axioms, and RG coefficient axioms. A formal mathematics volume should not hide this. In proof engineering, a labelled `sorry` is a map of future work. In public prose, ignoring it is overclaim. `open-hypothesis`'
