- id: M6
  quote: 'The mathematical cost is that the scale family is still a designed interface. Its fibres are not derived from a universal physical theorem. Nineteen of the twenty-one positions are assigned real types by import or local definition; two are string tags. Some assignments are natural, such as organism scale to `Field8` or swarm scale to `SwarmState 8`. Others are proxies: `StellarNeighbour`, `GalacticDisc`, and similar positions use available wave-vector or fluid/cosmology types. A type family can enforce consistency once the assignment is made; it does not prove the assignment is the unique or empirically correct one. `derived-under-assumptions`'
