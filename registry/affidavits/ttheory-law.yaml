- id: L8
  quote: 'A finding is disposed of in one of two ways: the document is corrected in a new version, or the finding is kept as an exhibit. A new version gets a new affidavit; the old one stays, frozen, with its findings. The structure is precedent''s: a later decision may depart from an earlier one, but the earlier one remains in the reports, and the departure must be visible and reasoned. Sherlock''s `delta` tool states, for each claim of the earlier affidavit, whether the new version left it unchanged, edited it, probably fixed it or dropped it, so that a correction is a recorded departure, not a silent rewrite `kernel-verified`.'
