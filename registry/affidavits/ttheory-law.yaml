- id: L6
  quote: 'A persistent-homology study of such a right might encode stages of stress. Stage one: ordinary regulation. Stage two: heightened risk. Stage three: declared emergency. Stage four: prolonged emergency. Stage five: post-emergency normalisation. At each stage the researcher would ask whether core functions remain: criticising government, reporting facts, organising opposition, seeking judicial review, obtaining reasons, and challenging sanctions. The persistence interval would measure functional survival, not rhetorical survival `open-hypothesis`.'
