claims:
- id: L1
  quote: The caution must come first. [T]-Theory does not prove jurisprudence in Lean. The Lean proof surface verifies formal statements under definitions and axioms; five real `sorry`s remain across the repository; `FieldAxioms.lean` is an axiom registry, not a database of proven facts about the world. A theorem about a Hopfield energy function does not by itself establish what a right is. A type isomorphism does not make a constitution equivalent to M-theory. A simulation of an 8-qubit model does not validate legal reform. These boundaries are not disclaimers added after the argument. They are part of the method. The legal readings in this book are therefore mostly `interpretive` or `open-hypothesis`; formal machinery can discipline them, but it does not license doctrinal overclaim.
