- id: L5
  quote: 'Persistent homology of rights is the first candidate subprogramme. In topological data analysis, one studies features that persist across filtrations. The legal analogue would track a protected interest across increasing stress: ordinary policy disagreement, budget pressure, moral panic, emergency, hostile administration, court turnover, technological change, war, or regime transition. The question is not simply whether the word "right" remains in the text, but whether the protected function remains accessible. This could be piloted in a narrow domain `open-hypothesis`.'
