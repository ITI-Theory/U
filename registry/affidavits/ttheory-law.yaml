- id: L3
  quote: This book therefore separates three questions. The descriptive question asks how law changes behaviour, expectation, coordination, and institutional pathways. The analytic question asks how legal concepts such as rights, powers, duties, remedies, authority, and validity can be represented in a structured model. The normative question asks which landscapes are just, legitimate, rights-respecting, or rule-of-law compliant. [T]-Theory can contribute to the first two and can make the third more precise, but it does not answer the third by itself `interpretive`.
