- id: L7
  quote: The verdicts are three, and the third matters most. A claim may be proved, contradicted, or *not provable from what the knowledge base holds*. Sherlock never reads "not provable" as "false". Scots law long had a third verdict too, not proven, for the space between a conviction and a finding of innocence; whatever its merits in criminal trials, in research the third verdict is indispensable, because most of what a knowledge base does not say is simply unsaid, not denied `interpretive`.
