- id: L2
  quote: 'Hart''s framework is a useful first checkpoint. Hart''s primary rules guide conduct; secondary rules identify, change, and adjudicate primary rules. In field terms, primary rules alter the landscape directly, while secondary rules specify which landscape alterations count as legal alterations. The rule of recognition is especially important: it is not another ordinary barrier but a social practice among officials that identifies valid legal sources. It is therefore close to what this volume calls a meta-constraint: a constraint on the production of constraints `interpretive`. That translation is partial. Hart''s internal point of view cannot be reduced to behaviour alone; it is a practical attitude toward rules. Any field model that ignores that internal aspect would miss the legal character of legality.'
