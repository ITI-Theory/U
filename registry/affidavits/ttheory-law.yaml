- id: L4
  quote: The first task is a legal state space. A state space for law cannot be a single scalar. It must include at least normative text, institutional actor, procedure, enforcement probability, remedy, social meaning, cost of access, temporal delay, and affected class. For a rights domain, the state might encode doctrinal protection, standard of review, exceptions, remedy availability, enforcement frequency, and observed chilling effects. For a regulatory domain, it might encode compliance levels, sanctions, monitoring intensity, industry structure, political feedback, and harm indicators. The model's usefulness depends on disciplined dimensional choices `open-hypothesis`.
