- id: R3
  quote: 'The first question is about temperature. In statistical mechanics, high temperature means more exploration and less stable settlement; low temperature means sharper settlement and less exploration. In the field-modulated Hopfield model, effective temperature can be changed by limbic state. The Missing Limbic Layer paper writes this as $T(t)=T_0+\sigma\Phi_\text{limbic}(t)$ and $\beta(t)=1/T(t)$ `derived-under-assumptions`. The corresponding Lean theorem `stress_raises_temp` states, within the definitions of `LimbicHopfield.lean`, that a positive stress term raises temperature `kernel-verified`. The clinical reading is much weaker: bodily arousal may change how accessible transitions are. It might melt barriers; it might also flood structure. Which effect matters depends on the person, state, and context `open-hypothesis`.'
