- id: R5
  quote: 'Take emotional dysregulation. The term is clinically common and often imprecise. A field account separates at least four mechanisms. First, temperature may be too high: the field is noisy, transitions are uncontrolled, and small inputs produce large swings. Second, temperature may be too low: the field is locked, and the apparent outburst is the rare forced transition after prolonged constraint. Third, coupling may be mis-specified: somatic and narrative registers do not update together. Fourth, the environment may repeatedly inject forcing terms larger than the person''s current capacity. Each mechanism suggests different research variables. None licenses a one-size intervention.'
