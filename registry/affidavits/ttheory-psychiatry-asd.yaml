- id: R7
  quote: How, then, might the operator hypotheses be tested? A narrow first study could examine social synchrony under controlled conditions. Autistic and non-autistic participants, with participatory design, could choose preferred and non-preferred interaction modes. Researchers could vary noise, explicitness, pace, shared interest, and sensory environment while measuring subjective effort, physiological synchrony, recovery time, and mutual satisfaction. The Arnold-tongue hypothesis predicts not a global absence of synchrony, but a narrower or differently centred range of stable synchrony `open-hypothesis`.
