- id: R9
  quote: A useful research programme should change practice only after it changes questions, measures, and evidence. For this volume, progress would first mean better descriptions. A clinic that distinguishes transition cost from refusal, sensory forcing from anxiety, social bandwidth from social motivation, bodily safety from verbal reassurance, and burnout from ordinary fatigue has already improved its epistemology `interpretive`. That improvement does not require accepting the whole Universal Somatic Field. It requires noticing dynamics.
