- id: R1
  quote: The book therefore adopts three disciplines. First, every strong programme claim is labelled. Lean results are labelled only where a named theorem exists and are interpreted modestly. For example, `LimbicHopfield.correspondence_principle` establishes that the field-modulated network reduces to its baseline equations when limbic modulation is zero `kernel-verified`. It does not establish that any diagnostic category is identical to a Lean definition. QUANT-EXP-1 is an exact 8-qubit statevector simulation showing reachability in a model class `simulated`. It does not show that a quantum device treats trauma, that consciousness has been explained, or that therapy should be organised by quantum language.
