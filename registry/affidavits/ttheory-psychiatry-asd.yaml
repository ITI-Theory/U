- id: R6
  quote: For service design, the model's first implication is environmental humility. If a person repeatedly fails in a setting but functions in another, the difference may not be motivation. It may be the field-environment coupling. Clinics, schools, wards, and workplaces are not neutral containers. Lighting, noise, waiting-room uncertainty, forms, appointment timing, staff turnover, restraint policy, communication style, and discharge procedures all shape the field. A service that ignores these variables may misattribute its own design failure to patient pathology.
