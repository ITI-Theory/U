- id: R8
  quote: First, consider an autistic adult who wants close relationships but leaves most social events exhausted, ashamed, and unable to speak the next day. A deficit account may ask why the person avoids social life. A motivational account may ask whether anxiety is maintaining avoidance. A field account asks about coupling bandwidth. Were the interactions too noisy, too fast, too ambiguous, too multi-threaded, or too unpredictable? Did the person synchronise better around shared interest, parallel activity, written communication, or one-to-one rhythm? Was the collapse caused by social contact itself, or by forced entrainment outside the person's Arnold tongue? The answer would need measurement, but the question already reduces blame `open-hypothesis`.
