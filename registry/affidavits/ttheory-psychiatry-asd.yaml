- id: R2
  quote: 'The book''s own chapters do three things around those papers. The first chapter explains operator language in terms psychiatrists and neurodivergence researchers can use without accepting ontological overreach. The second chapter treats the pre-verbal manifold and lived testimony, carefully separating developmental research questions from claims about autism''s origin. The third chapter turns to clinical regimes and service design, again without giving treatment advice. The reading chapters then show how each embedded paper should be approached. The conclusion offers a research agenda and an ethics of modelling: if the field language is to help, it must increase respect, precision, and testability at once.'
