- id: R4
  quote: Every useful clinical language creates boundary cases. The operator vocabulary is no exception. One boundary case is ordinary preference. Not every strong interest is a deep attractor in a clinically relevant sense; sometimes it is simply what a person likes. Not every dislike of a noisy room is pathology; sometimes the room is unpleasant. The model should not medicalise taste. It becomes relevant when transition cost, distress, disability, access, or support need are at stake `interpretive`.
