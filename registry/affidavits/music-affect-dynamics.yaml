# Sherlock affidavit (DRAFT): A Dynamical Field Model of Music-Induced Affect:
# Beyond the Valence-Arousal Circumplex (P9). Schema: sherlock/registry.py.
# Arithmetic claims recomputed with Python (Fraction/numpy/scipy for exact and
# numeric checks) and verified before being written as `check:` templates.
# P24 (g2-symmetry-breaking) shares the BRECVEMA mechanism taxonomy and quotes
# an explicit 8x8 coupling matrix W_8 (G2Sym-MechanismCount=8); this paper
# names the same taxonomy (claim M1) but never instantiates numeric W entries
# of its own — its coupling matrix $W$ is left purely qualitative ("symmetric,
# negative semi-definite on the basin of each attractor", line 103), so no
