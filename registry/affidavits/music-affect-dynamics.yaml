claims:
  - id: M1
    quote: '(brainstem reflex, rhythmic'
    lines: [49, 50, 51, 52]
    kind: cross-paper
    finding: >-
      Juslin's BRECVEMA framework names only seven mechanisms here (brainstem
      reflex, rhythmic entrainment, conditioning, visual imagery, episodic
      memory, musical expectancy, appraisal) — one short of the 8-letter
      BRECVEMA acronym and of P24's eight named BRECVEMA mechanisms
      (G2Sym-MechanismCount=8), because Contagion (the "C") is not listed
      separately from "conditioning" (Evaluative Conditioning, the "E")
    verdict: contradicted
    label: kernel-verified
    lean: null
    check: [{template: ne, args: [7, 8]}]
    values:
      - {quantity: Music-BrecvemaNamedMechanismCount, value: 7}
      - {quantity: G2Sym-MechanismCount, value: 8}
    disposition: open
  - id: M2
    quote: 'duration: 114.88 s,'
