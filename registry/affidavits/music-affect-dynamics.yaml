      summary with total logged duration of only 114.88 s — about 6.4% of
      1,800 s, a roughly 15.7x shortfall — with no reconciliation of the
      block timings given
    verdict: contradicted
    label: kernel-verified
    lean: null
    check: [{template: rel-between, args: [114.88, 1800, 0.9, 1]}]
    values:
