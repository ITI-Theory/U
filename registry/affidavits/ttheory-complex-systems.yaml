- id: X5
  quote: 'A minimal measurement table would have seven columns: claim, system, state variable, operator, observable, competing model, and disconfirmation. For the dialect example, the observable could be feature frequency by locality and cohort; the competing models could be isotropic diffusion, mobility-network contagion, and sociolinguistic covariates. For active matter, the observable could be velocity-correlation response after perturbation; competitors could be Vicsek/Toner-Tu variants. For dyadic physiology, the observable could be lagged cross-correlation, phase locking, or recovery after a stressor; competitors could be ordinary coupled oscillator or state-space models. For swarm engineering, the observable could be coordination error under communication limits `interpretive`.'
