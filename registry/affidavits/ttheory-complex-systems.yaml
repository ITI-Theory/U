- id: X7
  quote: 'For teaching, this gives the volume a simple classroom use. Assign one embedded paper and ask students to build the operator table: variables, kernel, boundary conditions, observables, baseline models, and evidence label. Then ask which part of the paper would survive if the universal ontology were removed. The exercise usually leaves a substantial residue: a model of propagation, an attractor landscape, a formal theorem, a simulation, or a falsification protocol. That residue is the scientifically portable part of the programme.'
