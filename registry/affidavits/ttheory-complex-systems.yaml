- id: X2
  quote: 'A useful complex-systems version would proceed in three layers. The first is descriptive: fit a field or network model at one scale. The second is predictive: use the fitted model to forecast behaviour at the same scale under new boundary conditions. The third is renormalising: derive or learn a transformation from one scale''s parameters to another scale''s effective parameters, then predict higher-scale observables without refitting them freely. Only the third would justify strong scale-invariance language `open-hypothesis`.'
