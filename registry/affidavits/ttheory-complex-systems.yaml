- id: X6
  quote: 'A robust experimental pipeline could start with simulation. Simulations are not second-class; they are where assumptions become executable. The QUANT-EXP-1 result is useful because it states a landscape, dynamics, and outcome in a finite model. Similar simulations could be built for dialect diffusion, active-matter perturbations, dyadic synchrony, and swarm coordination. But simulation should be labelled `simulated`, and success in simulation should be followed by sensitivity analysis: how much depends on parameter choice, initial condition, noise, network topology, and threshold convention? `simulated`.'
