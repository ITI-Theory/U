- id: X3
  quote: 'A serious complex-systems book should say how the framework could fail. The first failure mode is triviality: if every system with a response can be called a USF instantiation, the claim loses content. To avoid triviality, the programme must require more than a loose propagator metaphor. It must demand matched operator form, specified boundary conditions, measurable observables, and predictions that would not be made by an unconstrained analogy `interpretive`.'
