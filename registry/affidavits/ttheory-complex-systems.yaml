- id: X4
  quote: One particularly clean test would begin with a single domain rather than the whole universe. Choose a data-rich system, such as bird-flock perturbation data, linguistic feature diffusion, dyadic physiological synchrony, or multi-agent drone coordination. Define the state vector, kernel family, boundary conditions, and observables. Estimate parameters on training data. Pre-register predictions on held-out data. Compare with standard models. Only after such within-domain success should cross-scale claims be attempted `open-hypothesis`.
