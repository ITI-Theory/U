- id: X1
  quote: 'This volume therefore has two tasks. First, it gives complex-systems readers a careful entrance into the embedded papers: the zoomable field architecture, geographic propagation, swarm coordination, Gestalt field dynamics, the foundational Soma-Field model, and the programme synthesis. Secondly, it states what would have to be true for the programme to graduate from suggestive cross-domain architecture to complex-systems theory: calibrated variables, explicit RG flows, measured exponents, competing null models, finite-size analysis, reproducible simulations, and domain-specific predictions that can fail `open-hypothesis`.'
