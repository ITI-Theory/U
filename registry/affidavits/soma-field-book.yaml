claims:
  - id: SFB1
    quote: '24% of the coupling matrix is trauma-formed'
    lines: [1174, 1175, 1176, 1177, 1178, 1185, 1186]
    kind: internal-arithmetic
    finding: >-
      the Lean-sketch explanation infers "more than 24%" trauma-formed from
      structuralFraction < tanh(1), but recomputing the boundary gives
      1 - tanh(1) = 0.238405844044235..., which is below 24%; the exact
      inequality only guarantees more than about 23.84%, so rounding tanh(1)
      down to 0.76 creates the stated 24% threshold
    verdict: contradicted
    label: kernel-verified
    lean: null
    check: [{template: lt, args: [0.238405844044235, 0.24]}]
    values:
      - {quantity: SomaField-PreVerbalTraumaFractionStated, value: 0.24}
      - {quantity: SomaField-PreVerbalTraumaFractionComputed, value: 0.238405844044235}
    disposition: open
