  quote: The Lean layer is the second concrete deliverable. The proof surface includes files such as `SwarmPropagator.lean`, `LimbicHopfield.lean`, `QuantumSim.lean`, `UniversalSomaticField.lean`, `EmotionOntology.lean`, and `FieldProofs.lean`. The important reading for a software engineer is not "the corpus is proved". It is that each theorem has a dependency shape. Some proofs are by definition or `rfl`; some are arithmetic; some use imported libraries; some depend on explicit axioms; five real `sorry`s remain across the proof surface. That dependency shape is what a serious verification culture should expose.
