- id: CS3
  quote: 'The experimental validation paper places four models side by side: Hopfield 1982 with sign activation, Krotov and Hopfield''s dense-associative/polynomial variant [@krotov2016dense], Hopfield 2020 with softmax attention, and the Field-Modulated Hopfield Network. The benchmark task is a stylised basin-crossing from startle or fear toward musical awe. The reported qualitative result is that the classical models settle into the wrong attractor while the FM-HN reaches the target through a WKB-like gate `simulated`. The exact task is small and stylised; the important computing point is the model comparison protocol, not a general performance claim.'
