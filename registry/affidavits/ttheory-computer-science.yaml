- id: CS5
  quote: The repository root pins `leanprover/lean4:v4.33.0`; `lakefile.toml` directly requires Mathlib and physlib at v4.33.0 and OSforGFF at a pinned commit, with one small compatibility patch recorded in the repository. Those are build-configuration facts, not proof results. The proof surface therefore has to be read as dependency information. `SwarmPropagator.lean` contains arithmetic cost theorems and an axiom for global optimality. `LimbicHopfield.lean` contains algebraic theorems about temperature and weight modulation. `QuantumSim.lean` contains a small WKB-gate reachability theorem for a two-state abstraction and theorem `quant_exp_1_awe_reachable` derived from it. `UniversalSomaticField.lean` contains scale and threshold definitions. `FieldAxioms.lean` is explicitly an axiom registry with twenty `axiom` declarations. The repository also has five real `sorry`s in three files, so whole-programme "no sorries" language would be wrong.
