- id: CS4
  quote: The break-even theorem is equally important. `breakeven_at_N` says the costs are equal at $K=N$. `classical_wins_single_round` says classical cost for $K=1$ is lower than the dense propagator cost when $1<N$. These two theorems prevent a misleading reading. The propagator wins only when the comparison baseline needs enough rounds. The paper's engineering value is therefore not "field methods always beat message passing". It is "if convergence is slow enough, precomputed dense response can be cheaper than repeated local rounds" `kernel-verified`.
