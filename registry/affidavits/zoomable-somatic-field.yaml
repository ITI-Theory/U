equations:
  - id: Q1
    quote: $(\nabla^2 + k^2)G(x,x') = \delta(x-x')$
    lines: [11]
    twin: k**2*G = delta3
    note: the Helmholtz equation term by term (the Laplacian has the units of k squared); G is 1/m in three dimensions
  - id: Q2
    quote: $G_e(x,x') = e^{ik|x-x'|}/(4\pi|x-x'|)$
    lines: [484]
    twin: G_e = exp(1j*k*r)/(4*pi*r)
  - id: Q3
    quote: $k = \lambda_\text{axon}^{-1} \approx 2000$
    lines: [501, 502]
    twin: k = 1/lambda_axon
    where: {lambda_axon: 0.5}
    expect: 2000
    tolerance: 0.01
  - id: Q4
    quote: $k = \omega/c_\text{neural} \approx 2\pi \times
    lines: [531, 532]
    twin: k = 2*pi*f/c_neural
    where: {f: 40, c_neural: 6}
    expect: 40
    tolerance: 0.1
  - id: Q5
    quote: $$\Theta(W) = \exp\!\left(-\frac{8\sqrt{2W}}{3}\right) \tag{12}$$
    lines: [857]
    twin: Theta = exp(-8*sqrt(2*W)/3)
  - id: Q6
    quote: -4Wx(x^2-1) < 0
    lines: [849]
    twin: dxdt = -4*W*x*(x**2-1)
    where: {W: 8, x: -0.5}
    expect: -12
    tolerance: 0.001
