- id: C6
  quote: 'Before any SFT-informed clinical decision support is built, there should be governance at five levels. First, scientific governance: preregistered hypotheses, independent statistics, and open negative results. Second, clinical governance: professional oversight, adverse-event procedures, and clear separation from treatment recommendation. Third, service-user governance: people with trauma histories and neurodivergent people involved in design and interpretation. Fourth, cultural governance: attention to race, class, migration, disability, gender, and institutional power. Fifth, formal governance: a claim ledger that states which claims are axioms, simulations, interpretations, and open hypotheses (`interpretive`).'
