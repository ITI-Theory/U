- id: C5
  quote: 'The field model is most credible when it clarifies rather than replaces established trauma science. This chapter therefore revisits four established areas: autonomic state, tolerance window, memory change, and complex trauma. Each is already a large literature. SFT''s role is to ask whether a shared dynamical vocabulary can connect them without erasing their differences (`interpretive`).'
