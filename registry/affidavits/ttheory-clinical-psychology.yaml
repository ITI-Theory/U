- id: C3
  quote: 'The first measurement domain is state. Trauma research already uses self-report scales, clinician ratings, behavioural tasks, and physiological measures. SFT would need repeated state measures fine-grained enough to detect transitions. A single pre/post symptom score cannot reveal a landscape. Researchers would need time series: momentary affect, bodily sensation, context, perceived safety, dissociation, intrusive material, avoidance, interpersonal rupture and repair, sleep, pain, and medication changes. The burden is high because attractor claims are dynamic claims (`open-hypothesis`).'
