claims:
- id: C1
  quote: 'A fair clinical science reading of SFT has five layers. First, there is phenomenology: testimony about what it is like to have affect present below language. Second, there is construct modelling: variables such as $e(t)$, $W$, $T_{\text{eff}}$, $K(t)$, and $J(t)$. Third, there is formal consistency: whether the equations and Lean definitions do what the prose says. Fourth, there is simulation: whether toy systems show predicted transitions. Fifth, there is empirical validation: whether human data support the constructs in a way that changes prediction (`interpretive`). Most of the programme currently lives in the first four layers. Clinical authority would require the fifth.'
