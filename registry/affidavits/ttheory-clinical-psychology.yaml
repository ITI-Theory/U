- id: C7
  quote: 'The clinical interest lies in the three operator sketches: ADHD, Autism Spectrum Condition, and C-PTSD. For this volume, the C-PTSD operator is the relevant one: high barriers, memory, and altered coupling model why self-organisation disturbances may persist beyond individual fear memories (`open-hypothesis`). The numerical parameters in the paper are model parameters, not biomarkers. The paper should inspire measurement design, not diagnostic classification. Its best use is to ask whether physiological and behavioural data can distinguish temperature-like volatility, low-temperature rigidity, and high-barrier capture in traumatised populations.'
