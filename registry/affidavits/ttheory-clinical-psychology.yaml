- id: C2
  quote: The discipline of labels is central. In this book, `kernel-verified` means a named Lean theorem compiles without `sorry` in the named proof surface. It does not mean the clinical interpretation is proved. `derived-under-assumptions` means a result follows from stated definitions, axioms, or model choices. `simulated` means a computational model produced the stated output. `empirical-result` means a documented measurement or experiment produced a result. `interpretive` means a conceptual mapping or explanatory reading. `open-hypothesis` means a claim with a path to discrimination but no settled evidence. These labels are not decoration. They are the book's safety system.
