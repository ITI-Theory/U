- id: C4
  quote: A minimal observational study might recruit adults with trauma histories and collect two weeks of ecological momentary assessment plus wearable physiology. It would not change treatment. It would ask whether state transitions show attractor-like recurrence and whether candidate temperature metrics predict transition frequency, dwell time, or subjective window. Such a study could fail cleanly. If no attractor structure appears, SFT weakens. If simpler models predict as well, SFT adds little (`open-hypothesis`).
