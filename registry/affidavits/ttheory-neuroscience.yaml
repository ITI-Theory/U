- id: N3
  quote: The physical substrate paper broadens this to biotensegrity, fascia, interstitial signalling, mechanical stress, bioelectricity, and contested biofield physiology. Neuroscientists should separate three levels. First, the body is mechanically continuous; fascia and connective tissue transmit force and house sensory endings. Second, interoceptive pathways carry bodily state to the nervous system. Third, stronger claims about coherent biophotonic or biofield correlates of emotion are speculative. The first two are mainstream enough to discuss as substrate; the third requires careful evidence and should remain explicitly open `open-hypothesis`.
