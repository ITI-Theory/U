- id: N7
  quote: 'A mature evidence ladder for this volume would have at least six levels. Level one is formal coherence: the equations are well defined and their limits behave as claimed. Level two is simulation: the model produces the predicted transitions in controlled artificial systems. Level three is measurement reliability: proposed neural and bodily parameters can be estimated consistently. Level four is cross-sectional prediction: parameters distinguish tasks or states better than baselines. Level five is longitudinal prediction: parameters forecast future transitions. Level six is intervention: changing a parameter changes the predicted dynamics under ethical and controlled conditions. The present programme is strongest at levels one and two, partial at level three, and mostly open beyond that `derived-under-assumptions`.'
