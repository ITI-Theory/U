- id: N4
  quote: The first rung is measurement reliability. Before Arnold tongue width, effective field temperature, or attractor depth can be used theoretically, they must be reliable within individuals and sensitive to known manipulations. A steady-state auditory or visual entrainment task can estimate phase locking across frequencies. A respiration-paced interoceptive task can estimate coupling between bodily rhythm and cortical response. Resting-state EEG or MEG can estimate source-space spectral structure, but resting state alone is weak because it lacks a controlled input. The field programme should therefore prefer active response paradigms over passive maps `open-hypothesis`.
