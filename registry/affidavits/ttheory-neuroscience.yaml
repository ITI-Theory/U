- id: N2
  quote: One candidate design is an affective entrainment protocol. Participants receive rhythmic auditory, visual, tactile, or interoceptive stimuli across a frequency range while EEG/MEG and autonomic data are recorded. Source-space phase locking, cross-frequency coupling, HRV, respiration, skin conductance, pupil size, and report are modelled together. The predicted Arnold tongue is not merely the range in which a cortical signal follows a stimulus; it is the range in which cortical, autonomic, and subjective responses cohere. The model predicts state-dependent narrowing or broadening under stress, fatigue, hypervigilance, dissociation, or focused attention. Failure to find such state dependence would constrain the theory `open-hypothesis`.
