- id: N8
  quote: First, the electromagnetic claim must be narrowed to what can be measured. Brains generate fields; EEG and MEG measure aspects of them; ephaptic effects can occur; CEMI proposes that endogenous EM fields carry and causally integrate conscious information. SFT extends this by asking whether affective field state is visible in response functions, entrainment, perturbation recovery, and state-dependent attractor dynamics. The claim remains open until field variables predict something that local activity, anatomy, and standard connectivity do not `open-hypothesis`.
