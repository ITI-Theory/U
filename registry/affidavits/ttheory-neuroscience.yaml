- id: N6
  quote: Because [T]-Theory deliberately crosses vocabularies, it needs a stricter evidential grammar than a single-domain model. A neuroscientist should ask four questions of every claim. What is the measured variable? What is the model variable? What mapping connects them? What result would force revision? If any of the four is missing, the claim is not yet neuroscience `interpretive`.
