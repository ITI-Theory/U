claims:
- id: N1
  quote: 'What, then, does this volume offer neuroscientists? First, it offers a way to connect CEMI, ephaptic coupling, field measurement, and coherence without collapsing them into one claim. Second, it offers a Hopfield-attractor language for affect that explicitly includes body-state modulation. Third, it offers a developmental hypothesis about pre-verbal structure that can be tested rather than merely narrated. Fourth, it offers an evidence discipline: Lean proofs for definitions, simulations for model reachability, empirical neuroscience for measurement, and open labels where the bridge is not yet built. The value of the programme is not certainty. It is the possibility of asking a sharper question: what physical variables would have to be measured for felt affect to become a field-theoretic object in neuroscience `interpretive`?'
