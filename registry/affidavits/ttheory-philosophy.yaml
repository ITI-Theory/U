- id: P4
  quote: 'The corpus of books matters because it shows the programme''s diffusion across domains. The first fifteen domain books are largely wrappers and thematic dossiers around a smaller repeated kernel: Soma Field Theory, mathematical co-identification, QUANT-EXP-1, Zoomable USF, limbic Hopfield dynamics, pre-verbal manifold material, and benchmark or swarm papers. Their value is rhetorical routing: generalist, physicist, neuroscientist, therapist, computing reader, mathematician, philosopher, complex-systems reader, music and arts reader, geological reader, social-field reader, economist, legal theorist, PPE reader, and clinical/neurodivergence reader. Their danger is promotion of hypotheses into certainty. This philosophy volume must therefore be less a sixteenth wrapper than an audit of the whole method.'
