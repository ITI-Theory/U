  quote: The six evidence labels need a little practice. A `kernel-verified` claim is a named Lean theorem whose stated proof surface has been checked by Lean's kernel, without treating that label as a claim that the world obeys the theorem's intended interpretation. The theorem may still depend on definitions, imported theorems, and explicit axioms, and other files in the wider proof surface may still contain holes. A `derived-under-assumptions` claim follows from stated mathematical or modelling premises. A `simulated` claim reports the output of a computational model. An `empirical-result` claim reports documented measurement or build output. An `interpretive` claim is a conceptual mapping or philosophical reading. An `open-hypothesis` is a proposed claim with a possible route to confirmation or disconfirmation.
