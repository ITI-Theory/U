# TYPING: "QUANT-EXP-1" is treated throughout as the name of a published
# experiment/result (an event or exhibit), not a physical quantity or a
# theorem; OpenCyc mapping candidate: Event-Localized or
# ExperimentalExhibitionEvent (via lookup.py "experiment"), not a
# PhysicalQuantity constant.
# TYPING: "the God-Knob" is used both as the name of the source term
# J_user(t) (a function/variable) and, informally, as the name of the
# hysteresis test protocol built around it; worth a reading split
# (TestProtocol vs. MathematicalFunction-Programs) if this paper is pursued
# further for typing claims.
# TYPING: "barrier W" / "barrier height W" is used as a scalar parameter of
# the WKB gate (`T = exp(-W)`), not as a spatial or energetic "barrier"
# object in the OpenCyc sense of a physical obstacle; candidate mapping is
# to a ScalarIntervalParameter or similar, not SpatialThing-Localized.
# TYPING: "the awe basin" / "fear basin" name attractor regions of a
# dynamical system's state space, not emotions themselves (the emotions are
# BRECVEMA-dimension labels on points in that space); candidate OpenCyc
# mapping is AttractorRegion-adjacent (a region-of-space-like construct)
# rather than directly an Emotion-TypeByAppraisal individual.
