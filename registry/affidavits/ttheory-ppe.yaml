- id: PPE7
  quote: The last task before closing is to say clearly how this PPE volume could be wrong. A programme that travels across mind, market, and mandate needs safeguards stronger than elegance. The first safeguard is domain sovereignty. Philosophical concepts are not waiting to be translated into physics; political concepts are not merely social mechanics; economic concepts are not psychological metaphors. Each has its own success conditions. A translation is worthwhile only if it preserves those conditions while adding clarity.
