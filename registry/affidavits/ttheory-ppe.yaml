- id: PPE2
  quote: This move can be useful in three ways. First, it explains why the same person can rank alternatives differently under stress, framing, social pressure, fatigue, trauma, or institutional threat. The field has not revealed irrationality in the simple sense; it has exposed different accessible basins. Second, it gives PPE a vocabulary for preference formation. Preferences are neither wholly sovereign nor wholly manipulable. They are shaped by education, law, market architecture, bodily states, memory, class position, and interpersonal relations. Third, it makes room for rationality as a dynamic achievement. An agent is rational not because every local choice satisfies a static axiom, but because the agent can maintain, revise, and navigate a sufficiently coherent landscape over time.
