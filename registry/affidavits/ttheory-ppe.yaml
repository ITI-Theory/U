- id: PPE3
  quote: 'This lets [T]-Theory make a modest but useful contribution. It can distinguish four evaluative questions that are often collapsed. The first is *stability*: does the agent''s landscape settle, or is it chaotic and overheated? The second is *flexibility*: can the agent leave a basin when reasons, evidence, or circumstances change? The third is *range*: are there enough meaningful basins for a life to be chosen rather than merely endured? The fourth is *authority*: were the landscape''s main barriers and attractors formed under conditions compatible with autonomy, recognition, and justice? Only the first is close to a dynamical property. The others require normative and political judgement.'
