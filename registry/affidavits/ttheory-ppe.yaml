- id: PPE4
  quote: 'A PPE mapping should pass five checks before it is treated as co-identification. First, the type signature must match: variables, domains, codomains, constraints, symmetry, boundary conditions, and admissible transformations. Second, the imported theorem must depend only on the shared structure, not on source-domain features absent from the target. Third, the target-domain interpretation must be stated separately. Fourth, failure conditions must be registered. Fifth, the evidence label must follow the weakest link: a Lean theorem about a definition does not become an empirical theorem about markets or rights merely because the same word appears in prose.'
