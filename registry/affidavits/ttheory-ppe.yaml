claims:
- id: PPE1
  quote: 'The book''s own argument has four steps. First, it develops rationality and well-being as landscape problems while refusing to equate stability with value. Second, it reads institutions, legitimacy, and collective action as constraint design under conditions of contestation. Third, it brings welfare economics and social choice into the model, showing how Arrow and Sen discipline any talk of collective attractors. Fourth, it offers a method for PPE research: every proposed mapping must be labelled as analogy, co-identification, or identity, with its assumptions and failure conditions exposed. If [T]-Theory survives PPE, it will do so not by dissolving the three disciplines into one but by helping them speak to each other without losing their own tests of truth.'
