- id: PPE5
  quote: 'The PPE synthesis should therefore distinguish four layers of social evaluation. The first layer is *choice*: what do persons or groups select under given conditions? The second is *welfare*: how well do those choices and conditions support lives going well? The third is *rights*: what may not be traded away by aggregate improvement? The fourth is *legitimacy*: how are collective decisions authorised, contested, and revised? A field diagram can display interactions among the layers. It cannot compress them into one number without losing the reason PPE exists.'
