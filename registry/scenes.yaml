# The scenes (ISS-125): one per place, recorded once, used everywhere. The author, 20 Oct 2026: "for each screen
# view ... we need text and speech, and we just string it together ... reusable, rather than just for this film";
# "for each level we need a few: U, rooted, academic ... focus on U".
#
# A scene: a place in the app (its view), its words for each user (registry/users.yaml: u, scientist, rooted), its
# evidence label and source, how to say it, a cue (what the screen and the music do), and for U its hook (a question
# and its answer, two lines each: the scene's own theme, Me/music/hook.py). A tour step `scene: <id>` takes the view,
# the words and the label (U by default); a film is a tour of scenes, timed by the author's takes once they exist.
# The narrator's script (docs/narration, `make -C docs/narration`) lays the scenes out for reading aloud.
#
# The words are written to be SPOKEN: one breath to a line; `/` a short pause, `//` a longer one; *a word* is
# stressed. (The app's subtitles drop the marks.) The register for U (the author, 20 Oct): OpenStax's (Astronomy 2e,
# its first chapter a tour of the scales; Biology 2e, Psychology 2e): one concrete comparison, how we know, plain
# words; its facts checked against the pages named in `source` (CC BY 4.0, credited). The zoom: we try to BE each
# size: its now (the level's response time, registry/levels) and its neighbour. Status: draft (Copilot's words,
# 20 Oct); the author corrects every scene before he records it.
schema_version: 1
users: [u, scientist, rooted]
scenes:
  # ---------------------------------------------------------------- the opening
  - id: being-the-size
    view: level=human-vertebrate&voyage=worlds&dim=11&phi=0.5
    status: draft
    u:
      label: interpretive
      source: "the author's own words (20 Oct 2026), lightly edited"
      how: "Your own voice, unhurried, thinking aloud. Not a performance; you, telling a friend what you noticed."
      cue: {screen: "The worlds: the instrument at rest, glass domes from the quantum to the cosmos.", music: "A low pedal under you; the first notes of the theme only after you finish."}
      say: |
        When I see a picture of a man, / or a picture of a mountain,
        the pictures may be the *same* size,
        but in my head / I see two different scales.
        Seeing a picture of a mountain / is different again
        from standing at its foot, / or sitting on its summit.
        Yet even on the summit,
        I don't feel the mountain next door
        the way I feel a person / sitting next to me.
        I have climbed, / but my eyes are still the size they were. //
        So in this film, / when we change size,
        we try to *be* that size:
        to feel how long its moment lasts, / and who its neighbour is.
      hook:
        question: ["Can I be the size of the thing I see?", "Can my now grow long, or shrink to a spark?"]
        answer: ["Only if my eyes forget their own size,", "and I feel what the next one of me feels."]
    scientist: open
    rooted: open
  - id: you-are-here
    view: level=human-vertebrate&voyage=human&dim=11&phi=0.5
    status: draft
    u:
      label: interpretive
      source: "registry/levels/human-vertebrate.yaml (response time 10^1 s)"
      how: "Close and quiet, as if the listener is sitting right beside you."
      cue: {screen: "The jellyfish human: a body, its fields, a brain on top.", music: "The heartbeat pulse alone."}
      say: |
        Start here, / at your own size.
        A metre or two. / A body, / with a brain on top.
        Your *now* / is about ten seconds:
        a breath or two, / a sentence,
        the time it takes something to reach you, / and for you to answer it.
        Your *neighbour* / is the person beside you.
        Remember how that feels. //
        Every size we visit / has a now, / and a neighbour, / of its own.
      hook:
        question: ["How long is now, for someone my size?", "Who is the one beside me, breathing too?"]
        answer: ["A breath or two, a sentence, a turn of the head;", "you, and the warmth of you, close."]
    scientist: open
    rooted: open
  # ---------------------------------------------------------------- out: be the size
  - id: be-the-flock
    view: level=animal-swarm&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "registry/levels/animal-swarm.yaml (a group pattern, not a group mind; response time 10^0 s); the turning wave as in the cell-to-cosmos tour"
      how: "Lighter and a little quicker; let \"one\" land, then slow down for the hawk."
      cue: {screen: "The flock, turning.", music: "Strings flicker and turn with the birds; they settle as you speak."}
      say: |
        Now, / *be* the flock.
        Thousands of birds, / and no leader.
        Each one watches / only a few neighbours.
        And yet the flock turns / as *one*:
        a wave of turning crosses it
        faster than copying, bird by bird, / could carry it.
        There is no group mind here, / only a group pattern.
        As a flock, / your now is about a second.
        Your neighbour / is the next flock, // or the hawk.
      hook:
        question: ["Who decides when a thousand wings turn?", "Is there a leader I cannot see?"]
        answer: ["No one decides: the turn runs through us all,", "faster than any one of us could tell."]
    scientist: open
    rooted: open
  - id: be-the-city
    view: level=society-city&lens=on&dim=8
    status: draft
    u:
      label: interpretive
      source: "registry/levels/society-city.yaml (habits and information spreading through urban connections; response time 10^6 s, about eleven days)"
      how: "Conversational, a little wry; the list of things is quick, the \"ten days\" is slow."
      cue: {screen: "The city: its streets and connections lit.", music: "A busy, low murmur under you; a pulse that speeds and slows."}
      say: |
        Be the city.
        A few kilometres / of streets, / rules, / habits, / and people,
        all connected.
        A change in a city / — a rumour, / a fashion, / a fear —
        runs along those connections,
        and the roads and the networks / decide where it can go.
        A city is *slow* to answer:
        about ten days, / for a change to reach every street.
        Its neighbour / is the next city,
        trading with it, / copying it, / competing.
      hook:
        question: ["How does a city hear the news?", "How long before every street has heard?"]
        answer: ["Along the roads, the wires, the friends of friends:", "ten days, and the whole town knows."]
    scientist: open
    rooted: open
  - id: be-the-rock
    view: level=geological&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 8.2 (about a dozen plates, a jigsaw; plate tectonics as the planet's cooling system); registry/levels/geological.yaml (response time 10^13 s)"
      how: "Slow and heavy, like the rock. Leave space before \"and an earthquake\"."
      cue: {screen: "The plates and their faults.", music: "Deep, slow brass far below you; one low hit after \"lets go\"."}
      say: |
        Be the rock.
        Earth's crust is cracked / into about a dozen plates,
        fitted together / like the pieces of a jigsaw.
        Heat from deep inside / moves them, / very slowly:
        the plates are the planet's *cooling* system.
        Where two plates grind,
        rock holds the strain / for an enormously long time, //
        and an earthquake / is the moment it lets go.
        Your now / is hundreds of thousands of years.
        Your neighbour / is the plate you push against.
      hook:
        question: ["What does the mountain carry in its stone?", "How long can it hold before it moves?"]
        answer: ["Every push it never answered, held;", "then, in a minute, all of it, at once."]
    scientist: open
    rooted: open
  - id: be-the-planet
    view: level=planetary&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.6 (Earth about 13,000 km across, two thirds water; the Moon a quarter of Earth's size); the ringing as in the cell-to-cosmos tour; registry/levels/planetary.yaml"
      how: "Wonder, not drama. \"Like a bell\" is the picture; let it ring a moment."
      cue: {screen: "The whole Earth, slowly turning.", music: "A single low bell note after \"like a bell\", left to ring under you."}
      say: |
        Be the planet.
        Thirteen thousand kilometres across,
        two thirds of your skin / water.
        Strike it hard enough, / as a great earthquake does,
        and the whole Earth / rings like a *bell* / for days.
        Its deepest note / takes nearly an hour.
        These are physical feedbacks, / not feelings.
        Your neighbour / is the Moon, / a quarter of your size,
        pulling the oceans / up and down your sides, / twice a day.
      hook:
        question: ["If you strike the whole Earth, does it sing?", "How long before the ringing dies?"]
        answer: ["For days it rings, its deepest note an hour,", "and the Moon keeps pulling at the sea."]
    scientist: open
    rooted: open
  - id: be-the-orbits
    view: level=orbital-system&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.6 (Earth's orbital speed about 110,000 km per hour; light takes slightly more than 8 minutes from the Sun)"
      how: "Amused by the paradox: so fast, and you feel nothing. A small smile on \"nothing\"."
      cue: {screen: "The orbits, swinging round.", music: "A slow, wide waltz under you."}
      say: |
        Be the system of orbits.
        Planets and moons, / falling around each other, / and always *missing*.
        To stay in orbit,
        the Earth races round the Sun / at a hundred and ten thousand kilometres an hour, //
        and you feel / nothing.
        Light takes eight minutes / to reach us from the Sun:
        the latest news from our star / is always eight minutes old.
        Your now / is months: / the time for a world to swing round.
      hook:
        question: ["Why does the falling never end?", "Why does the Moon not reach the ground?"]
        answer: ["Because it is always falling past;", "we are all falling, and always missing."]
    scientist: open
    rooted: open
  - id: be-the-star
    view: level=stellar&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.6 (the basketball and the apple seed), 16.4 (the Sun's pulsations, about 5 minutes a cycle; helioseismology)"
      how: "Lead up to the surprise; \"The Sun breathes\" is the moment. Then plain again."
      cue: {screen: "The Sun, close up, its surface moving.", music: "Under you, a soft swell and fall every few seconds, like breathing."}
      say: |
        Be the star.
        Shrink the Sun to a basketball,
        and the Earth / is an apple seed / thirty metres away.
        And here is a surprise. //
        The Sun *breathes*.
        Its surface rises and falls, / in thousands of patches,
        each cycle / about five minutes long.
        From those ripples / we read the Sun's insides,
        the way earthquakes tell us / about the inside of the Earth.
        Being big / is not the same / as being slow.
      hook:
        question: ["Can something so vast be quick to answer?", "What is the Sun doing every five minutes?"]
        answer: ["It breathes, it rings, it ripples on its skin,", "and we read its heart from the sound."]
    scientist: open
    rooted: open
  - id: be-the-remnant
    view: level=compact-object&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, chapter 1 introduction (a collapsed star: every human being on Earth squeezed into a single raindrop); registry/levels/compact-object.yaml (ring-down, 10^-3 s)"
      how: "Hushed for the raindrop; crisp and quick for \"the densest things answer fastest\"."
      cue: {screen: "The collapsed star, ringing down.", music: "A struck bell, very high and short, then silence under you."}
      say: |
        Be what is left / when a great star dies.
        A collapsed star, / so dense
        that to match its insides
        you would have to squeeze every human being on Earth
        into a single *raindrop*.
        Disturb it, / and it rings down / like a struck bell,
        in a few thousandths of a second.
        The densest things / answer fastest.
        Your neighbour / may be another one, / spiralling in,
        until the two / become one.
      hook:
        question: ["What is left when the great fire is gone?", "How fast does the heaviest thing reply?"]
        answer: ["A bell of crushed light, struck once;", "a thousandth of a second, and still."]
    scientist: open
    rooted: open
  - id: be-the-galaxy
    view: level=galactic-disc&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.6 (hundreds of billions of stars; the disc 100,000 light-years across; the Sun somewhat less than 30,000 light-years from the centre), 1.7 (Andromeda, a little more than 2 million light-years); registry/levels/galactic-disc.yaml (10^16 s)"
      how: "Spacious. \"Nothing much to distinguish it\" is gently funny; say it straight."
      cue: {screen: "The Milky Way's disc from above, turning.", music: "The full orchestra, very soft and very wide."}
      say: |
        Be the galaxy.
        Hundreds of billions of stars,
        in a disc / a hundred thousand light-years across.
        Our Sun / is one of them,
        somewhat less than thirty thousand light-years from the centre,
        in a place / with nothing much to distinguish it.
        Your now / is one turn of the disc:
        a couple of hundred million years.
        Your nearest large neighbour / is Andromeda,
        a spiral much like you, / a little more than two million light-years away.
      hook:
        question: ["How long is a day for a turning sea of stars?", "Who is out there, so like me, across the dark?"]
        answer: ["One turn, two hundred million years;", "and Andromeda, our neighbour, shining back."]
    scientist: open
    rooted: open
  - id: be-the-halo
    view: level=galactic-halo&lens=on&compare=1&contours=1
    status: draft
    u:
      label: open-hypothesis
      source: "OpenStax Astronomy 2e, 1.6 (dark matter: known by the pull of its gravity; what it is made of remains a mystery); the programme's reading is a proposal (registry/model.yaml)"
      how: "Honest and careful; slow down for \"remains a mystery\". The last sentence matter-of-fact, not apologetic."
      cue: {screen: "The halo: contours around the galaxy.", music: "Something low and unresolved, never landing."}
      say: |
        Be the halo: / the wide, / unseen region / around the galaxy.
        There is more to a galaxy / than meets the eye, / or the telescope.
        We know something is there
        from the pull its gravity has / on the stars we *can* see.
        What it is made of / remains a mystery.
        The programme offers / its own reading of what it might be. //
        That is a proposal, / and it is labelled so.
      hook:
        question: ["What holds the spinning stars from flying free?", "What is the dark that has a weight?"]
        answer: ["We see it only by how the bright things move:", "a shape we feel, and do not see."]
    scientist: open
    rooted: open
  - id: be-the-cluster
    view: level=galaxy-cluster&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.7 (the Local Group, more than 50 galaxies; clusters of thousands; the Virgo Supercluster, 110 million light-years across)"
      how: "Building, one step bigger each line; then settle on \"billions of years\"."
      cue: {screen: "The cluster: galaxies like a swarm.", music: "The orchestra grows a little at each step, then thins as you finish."}
      say: |
        Be the cluster.
        Galaxies, / like towns, / gather into groups.
        Ours, / with Andromeda, / is a small cluster of more than fifty galaxies:
        the Local Group.
        Farther out, / clusters of *thousands*.
        And the clusters gather / into superclusters;
        ours stretches / more than a hundred million light-years.
        Here your neighbours / are whole galaxies,
        and your now / is billions of years.
      hook:
        question: ["When galaxies are neighbours, how do they meet?", "Do they collide, or pass like ghosts?"]
        answer: ["Their stars slip by, so far apart they never touch;", "only the gas and the gravity collide."]
    scientist: open
    rooted: open
  - id: be-the-filaments
    view: level=cosmic-filaments&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "registry/levels/cosmic-filaments.yaml (threads where galaxies and dark matter gather, carrying earlier density patterns); OpenStax Astronomy 2e, 1.7 (superclusters)"
      how: "Quiet wonder; \"your memory is older still\" is the line to keep."
      cue: {screen: "The threads, galaxies strung along them.", music: "Long held notes, a web of them."}
      say: |
        Be the threads.
        On the largest maps, / galaxies are not scattered evenly.
        They gather / along giant threads,
        with vast, / nearly empty spaces / in between.
        The threads still carry the pattern / of tiny differences
        from when the universe was young.
        Your now / is billions of years, //
        and your memory / is older still.
      hook:
        question: ["Where do the galaxies gather, and why there?", "What is the web remembering?"]
        answer: ["Along the threads the first small ripples drew;", "the young universe, still in the old."]
    scientist: open
    rooted: open
  - id: be-the-universe
    view: level=observable-universe&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.7 (quasars 10 billion light-years away or more, seen 10 billion years in the past; the afterglow of creation from all directions)"
      how: "The biggest moment of act one; awe, but not loud. \"The afterglow of creation\" slowly."
      cue: {screen: "Everything we can see.", music: "The theme, high and far away, once; then the pulse under you."}
      say: |
        Be everything / we can see.
        The farthest beacons, / the quasars,
        are ten billion light-years away or more,
        so we see them / as they were / ten billion years ago.
        Beyond them, / coming from every direction,
        is the faint glow / of the beginning itself: //
        the *afterglow* of creation.
        This is cosmic structure, / not a mind in space.
      hook:
        question: ["How far can the oldest light have come?", "Is the whole of it still ringing?"]
        answer: ["From the edge of all that we can see,", "the first glow, cooling, faintly humming still."]
    scientist: open
    rooted: open
  - id: be-the-web
    view: level=cosmic-web&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.8 (the universe fantastically empty; places as dense as the human body tremendously rare); registry/levels/cosmic-web.yaml"
      how: "A turning point. Slow down after \"rare\"; \"So let's go back\" is warm, an invitation."
      cue: {screen: "The cosmic web, end to end; then the zoom turns.", music: "Everything stops after \"at all\"; one breath of silence; the turn."}
      say: |
        Be the web: / the largest pattern there is.
        Galaxies, / threads, / and empty spaces, / mapped from end to end.
        It is a structure we can map, / not a living thing.
        The universe / is fantastically empty:
        places as dense as a human body / are tremendously *rare*.
        And here / the zoom turns round. //
        At this size, / you cannot see yourself / at all.
        So let's go back, // and then go in.
      hook:
        question: ["At the largest size of all, where am I?", "Can the web of everything see me?"]
        answer: ["Too small to find, and still a part of it;", "turn round, and go back in."]
    scientist: open
    rooted: open
  # ---------------------------------------------------------------- in: be the size
  - id: be-the-brain
    view: level=whole-brain-cemi&lens=on&dim=8
    status: draft
    u:
      label: open-hypothesis
      source: "OpenStax Psychology 2e, 3.2 (neurons, about 100 billion at birth); registry/levels/whole-brain-cemi.yaml (a measurable pattern; consciousness claims labelled as hypotheses; response time 10^-1 s)"
      how: "Back home, closer and warmer. Careful on the last sentence; honest, not hedging."
      cue: {screen: "The glass brain, its signals lighting.", music: "The heartbeat again, and a faint shimmer above it."}
      say: |
        Back to you, / and in.
        Be your brain.
        About a hundred billion nerve cells,
        signalling, / all at once,
        making a pattern of electrical activity
        we can measure / from outside the head.
        Its now / is about a tenth of a second:
        a glance, / a flicker.
        Whether that shared pattern / is part of what you *experience*
        is a hypothesis, / and the app says so.
      hook:
        question: ["How quick is a thought, from the inside?", "What do a billion signals make, together?"]
        answer: ["A tenth of a second, a glance;", "a pattern, and maybe more: we ask, we do not know."]
    scientist: open
    rooted: open
  - id: be-the-cell
    view: level=cellular-synaptic&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Biology 2e, 35.2 (resting potential about minus 70 millivolts; a threshold; the action potential); registry/levels/cellular-synaptic.yaml (10^-3 s)"
      how: "Tense and patient below the threshold; \"you fire\" sharp; then easy again."
      cue: {screen: "One nerve cell; a spike runs along it.", music: "A held tension under you; a single bright pizzicato on \"fire\"."}
      say: |
        Be one nerve cell.
        At rest, / your inside sits
        seventy thousandths of a volt / below the outside.
        Small nudges arrive / from your neighbours.
        Below a threshold, / they fade away.
        Above it, / you *fire*:
        all or nothing,
        a spike / about a thousandth of a second long.
        Your neighbour / is the next cell, / across a tiny gap: / the synapse.
      hook:
        question: ["How much must I be pushed before I speak?", "What happens to the whispers below?"]
        answer: ["Enough, and I fire, all of me, at once;", "the rest fades, quietly, and is gone."]
    scientist: open
    rooted: open
  - id: be-the-molecule
    view: level=molecular&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.8 (a molecule the smallest particle that keeps its chemical properties; water; about 10^19 atoms in each cubic centimetre of air); registry/levels/molecular.yaml (10^-13 s)"
      how: "Curious and playful; \"ten billion billion\" with relish."
      cue: {screen: "A molecule, its bonds shivering.", music: "Quick, light woodwind figures, far under you."}
      say: |
        Be a molecule:
        the smallest piece of anything / that still behaves like itself.
        Water / is two hydrogen atoms / and one oxygen, / held together.
        Even the air, / which we think of as empty,
        holds about ten billion billion atoms / in every cubic centimetre.
        A molecule's work / is its *shape*:
        change the shape, / and you change what it does.
        Your bonds / shiver / in a tenth of a millionth of a millionth of a second.
      hook:
        question: ["What does a molecule do with its shape?", "What happens if the shape is bent?"]
        answer: ["Its shape is its work, its key, its word;", "bend it, and it says something else."]
    scientist: open
    rooted: open
  - id: be-the-atom
    view: level=atomic&lens=on&compare=1
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.8 (the electrons typically 100,000 times the nucleus's size away; an atom far emptier than the solar system out to Neptune); the spectrum's lines as in the cell-to-cosmos tour"
      how: "Gentle surprise on \"mostly space\". The last two lines are a small gift; warm."
      cue: {screen: "The atom, its spectrum lines beside it.", music: "A few clear, pure notes, the atom's own lines."}
      say: |
        Be an atom.
        A tiny nucleus, / and around it, / a cloud of electrons,
        a hundred thousand times wider / than the nucleus itself.
        A typical atom / is far emptier
        than the solar system / out to Neptune.
        Even solid things / are mostly *space*.
        Nudge an atom with light, / and it answers only at certain colours:
        its notes, / measured with great precision.
        Your neighbour / is the next atom:
        share electrons with it, / and together / you become a molecule.
      hook:
        question: ["Why does an atom answer only certain light?", "What happens when two atoms share?"]
        answer: ["It has its notes, like a string;", "and two that share become something new."]
    scientist: open
    rooted: open
  - id: be-the-nucleus
    view: level=nuclear&lens=on&dim=8
    status: draft
    u:
      label: empirical-result
      source: "OpenStax Astronomy 2e, 1.8 (the nucleus holds the bulk of the atom's matter, protons and neutrons bound tightly in a very small space; four forces, two of them acting at the nuclear level)"
      how: "Firm and compact; the four forces as a short, clear list."
      cue: {screen: "The nucleus, bound tight.", music: "Low strings, short and tight; almost nothing moving."}
      say: |
        Be the nucleus: / the atom's heart.
        Protons and neutrons, / bound tightly together / in a very small space.
        Almost all of the atom's matter / is here.
        Everything in the universe / runs on just four forces:
        gravity, / electromagnetism,
        and two / that act only / at this size.
        Their grip / hardly reaches / past the nucleus itself.
        A nudge here / fades / almost before it starts.
      hook:
        question: ["How far can the strongest grip reach out?", "How long does a nudge last, in here?"]
        answer: ["Hardly past itself, it holds what it can touch;", "and gone before it can be felt."]
    scientist: open
    rooted: open
  - id: be-the-boundary
    view: level=string-boundary&lens=on&dim=4
    status: draft
    u:
      label: open-hypothesis
      source: "registry/levels/string-boundary.yaml (a theoretical boundary picture, not an observed object)"
      how: "Quiet and honest; slow on \"not something anyone has seen\"."
      cue: {screen: "The boundary: the picture becomes a drawing.", music: "Almost nothing: a single high harmonic."}
      say: |
        Below that, / the pictures become *models*, / not photographs.
        Some physics imagines / tiny vibrating strings / beneath the particles.
        This is a model boundary,
        not something anyone has seen, //
        and the app says so.
      hook:
        question: ["What lies beneath the smallest thing we know?", "Is it real, or the shape of our maths?"]
        answer: ["A model, played like a string, not seen;", "we draw the edge, and say it is an edge."]
    scientist: open
    rooted: open
  - id: foam
    view: level=quantum-foam&lens=off&dim=4
    status: draft
    u:
      label: open-hypothesis
      source: "registry/levels/quantum-foam.yaml (a cautious picture of quantum fluctuations, not a claim we can watch them; response time 10^-44 s)"
      how: "Softest of all, the end of the dive. \"This is where the climb begins\" lifts: a beginning, not an end."
