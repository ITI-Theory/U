# A film as a tour of scenes (ISS-125): each step's view, words and label come from registry/scenes.yaml.
id: film-be-the-size
title: Be the size (a film, about thirty minutes)
summary: 'The author''s 30-minute film and tour of the app, made of scenes (registry/scenes.yaml, ISS-125), his
  voice over the flight. Act one: be the size, from your own out to the cosmic web, then in to the foam, each size
  with its own now (its response time) and its neighbour. Act two: inside the instrument, the main screens. Act
  three: the poke, the field at every size, and back to you. Draft words (Copilot''s, 20 Oct): the author corrects
  every scene before he records it; his takes will pace it. Play with ?film=1#tour=film-be-the-size.'
