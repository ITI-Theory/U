# MIRROR of Dist/PAPERS.yaml - do not edit here. Refresh with: make generate
# PAPERS.yaml — Master paper registry for the Universal Somatic Field research programme
# Single source of truth for: paper IDs, slugs, titles, DOIs, status, and file paths.
#
# STATUS values:
#   published         — live on Zenodo, current version is latest
#   needs-new-version — published but content changed; upload new version via Zenodo "New version"
#   pending-review    — PDF ready but content needs review before upload
#   pending-upload    — PDF ready; upload to Zenodo as new record
#
# FILE paths are relative to Dist/.
# DOI is the concept DOI (resolves to latest version).
# TITLE is the public Zenodo record title; SOURCE_TITLE (where present) is the
#   title used inside the paper itself.
# DISCIPLINE names the subject/register used for indexing.
# LEVEL values describe scholarly register/depth, not validation status.
# LEVEL vocabulary: popular, undergraduate, masters, phd, phd-proposal,
#   phd-programme, or ranges such as undergraduate-masters and masters-phd.
# All records: CC BY 4.0 · Alistair Johnson · ORCID 0009-0007-2194-0850 · Zurich, Switzerland.
#
# Mirrors (copy-on-release from this file):
#   U/.github/copilot-instructions.md  — AI context table
#   .github-private/profile/README.md  — org member profile
#   .github/profile/README.md          — public org profile
#
# Process runbook: Dist/zenodo/README.md
# Release log:     Dist/README.md

