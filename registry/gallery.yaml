# A Gallery of Thoughts (ISS-097): the art book and the app's Gallery view.
#
# Two clocks (author, 14 Oct). The main one is the programme's own development: the rooms run
# from its roots to October 2026, and `t` is how far along a room is (0 a raw pencil drawing
# with the pink and blue barely there, 1 the Soma Machine's own picture). The second is the
# era: where the text reaches back (Leibniz, Russell, Penrose, the Velvet Underground), the
# room's pictures are made as that time made pictures. Dates are from the record (git, the
# papers' registry, the dated chats); the chats are the story, never evidence.
#
# Every picture is the programme's own (an Atlas plate or an app capture), through a filter in
# lib/art/filters.py: `stage:<t>`, `pencil`, `engraving` (1714), `abstraction_1911`,
# `retro_bw` (1966), `distort:<amplitude>` (the field's amplitude). Artists of the eras are
# named, never reproduced (their pictures are theirs; the Calibre avant-garde collection is
# inspiration only). lib/art/gallery.py renders each plate for each format (`make -C
# Part2/book/gallery-of-thoughts plates`); the book's filter lays out the rooms from here.
# The curator's cut (author, 14 Oct: "only good art"): `candidate: true` marks a plate offered
# but not yet chosen; `make contact` draws every plate numbered, the author strikes the weak
# ones, and the survivors (the flag removed) set the book's length. First cut, 14 Oct 20:13:
# struck: the River score (murky at print), the 1966 crowd (nearly black), a third city,
# the 1911 dyad and region (too empty); every other candidate kept (Copilot's suggestion,
# the author's go).
schema_version: 1
title: A Gallery of Thoughts
subtitle: "[T]-Theory, as pictures"
author: Alistair Johnson
cover: {src: Part2/book/field-atlas/figures/app/voyage/cave-inside.png, chain: ["stage:1"]}
# Page shapes, with bleed where the printer wants it. A4 and A3 are the same shape, so one
# layout serves both; the projector edition is 16:9 (author, 14 Oct: A3 is the aim, A4 Lulu
# the short-term proof, the projector for showing it big).
formats:
  lulu-a4: {paper_mm: [303.35, 216.35], bleed_mm: 3.175, px: [3000, 2140]}
  a3: {paper_mm: [426.0, 303.0], bleed_mm: 3.0, px: [3840, 2731]}
  projector: {paper_mm: [320.0, 180.0], bleed_mm: 0, px: [2560, 1440]}
# Views captured for the Gallery only (`make -C Part2/book/gallery-of-thoughts captures`: the
# app at 4K into bld/gallery/hires/voyage/<id>.png, as the Atlas's voyage plates are made);
# a plate uses one with `src: hires:<id>`. The fractals (author, 14 Oct: "should be loads
# there, with a thought description"): the score's Mandelbulb at moments of the River Film's
# score (its seven feelings shape it: awe its power, safety its warmth, fear a cold hue and
# hard edges, grief takes the colour out), the dive into the Mandelbulb, the FLY worlds, the
# tunnel's fractal walls. labels=off: the picture without the app's words (the [T]-stop
# carries the reading).
captures:
  - {id: g-mind-departure, view: "voyage=score&dim=11&st=0.05&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-mind-descent, view: "voyage=score&dim=11&st=0.3&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-mind-approach, view: "voyage=score&dim=11&st=0.48&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-mind-deep, view: "voyage=score&dim=11&st=0.6&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-mind-awe, view: "voyage=score&dim=11&st=0.7&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-mind-return, view: "voyage=score&dim=11&st=0.95&kv=0.1&kc=mind&kx=0&labels=off", settle: 5000}
  - {id: g-river-departure, view: "voyage=score&dim=11&st=0.05&kv=0.1&kc=river&kx=0&labels=off", settle: 5000}
  - {id: g-dive-1, view: "level=whole-brain-cemi&voyage=flight&dim=11&phi=0.5&labels=off", settle: 5000}
  - {id: g-dive-2, view: "level=whole-brain-cemi&voyage=flight&dim=11&phi=0.5&labels=off", settle: 16000}
  - {id: g-dive-3, view: "level=whole-brain-cemi&voyage=flight&dim=11&phi=0.5&labels=off", settle: 30000}
  - {id: g-dive-fast, view: "level=whole-brain-cemi&voyage=flight&dim=11&phi=0.95&labels=off", settle: 20000}
  - {id: g-sea, view: "level=cellular-synaptic&voyage=flight&dim=11&phi=0.5&labels=off", settle: 6000}
  - {id: g-murmuration, view: "level=animal-swarm&voyage=flight&dim=11&phi=0.5&labels=off", settle: 6000}
  - {id: g-network, view: "level=local-circuit&voyage=flight&dim=11&phi=0.5&labels=off", settle: 6000}
  - {id: g-tunnel-brain, view: "level=whole-brain-cemi&voyage=tunnel&dim=11&phi=0.5&labels=off", settle: 5000}
  - {id: g-tunnel-city, view: "level=society-city&voyage=tunnel&dim=11&phi=0.5&labels=off", settle: 5000}
  # A thought, in five frames (author, 14 Oct: "I go into my mind, it's calm; a thought comes,
  # a bubble, in the cathedral; then it amplifies; then there are seven, and, and, and"): the
  # cathedral calm, one POKE, the bubble growing as Φ rises, THOUGHTS (avalanches, the large
  # ones pictures in bubbles), and with C-PTSD each one echoing. The bubbles are chance (the
  # app's dice); the settings are not. A burst of frames from one session (frames: the pauses)
  # gives a choice: g-cave-one-1.png ... -8.png.
  - {id: g-cave-calm, view: "voyage=brain&dim=11&phi=0.15&labels=off", acts: [cave], settle: 2500}
  - {id: g-cave-one, view: "voyage=brain&dim=11&phi=0.35&labels=off", acts: [cave, poke], act_wait: 300, settle: 200, frames: [0, 600, 600, 600, 600, 600, 600, 600]}
  - {id: g-cave-seven, view: "voyage=brain&dim=11&phi=0.9&labels=off", acts: [cave, thoughts, poke, poke, poke], act_wait: 500, settle: 500, frames: [0, 1000, 1000, 1000, 1000, 1000, 1000, 1000]}
  - {id: g-cave-echo, view: "voyage=brain&dim=11&phi=0.9&cp=0.8&labels=off", acts: [cave, thoughts, poke, poke, poke], act_wait: 500, settle: 500, frames: [0, 1000, 1000, 1000, 1000, 1000, 1000, 1000]}
  # The palace's top floor, the cosmos, the field at full (author: "max FX, very colourful, and
  # you see pictures of my thoughts"): ride to floor 21, PLACE five thoughts in the hall.
  - {id: g-palace-cosmos, view: "voyage=brain&dim=11&phi=1&palace=1&pf=21&labels=off", wait: 60000, acts: [pplace, pplace, pplace, pplace, pplace], act_wait: 1500, settle: 3000}
