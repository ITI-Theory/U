      - {id: october-thought, src: Part2/book/field-atlas/figures/app/voyage/thought.png, chain: ["stage:1"],
         caption: "Emotion and thought: a poke, and the field answers."}
      - {id: october-memory, src: Part2/book/field-atlas/figures/app/voyage/memory.png, chain: ["stage:1"],
