      - {id: october-cave, src: Part2/book/field-atlas/figures/app/voyage/cave-inside.png, chain: ["stage:1"],
         caption: "The cathedral: inside the fourth ventricle."}
      - {id: october-cave-out, src: Part2/book/field-atlas/figures/app/voyage/cave-outside.png, chain: ["stage:1"],
