    when: 14 October 2026
    t: 1
    ground: "05080F"
    file: rooms/12-universes-inside-universes.md
    plates:
      - {id: inside-palace, src: Part2/book/field-atlas/figures/app/voyage/palace-11.png, chain: ["distort:2"],
