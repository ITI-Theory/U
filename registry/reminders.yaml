items:
  - id: review-p21
    title: Review P21 for release
    source: ISS-001
    text: "Author: review P21 (cosmological constant), set it to pending-upload in Dist/PAPERS.yaml, then run make generate."
  - id: notebooklm-uat
    title: Run NotebookLM UAT
    source: ISS-001
    text: "Author: run fresh private nlm-uat from uat/staging for Sherlock, the Wizard and the Monster, then record results in paper/UAT.md."
  - id: lulu-print-preview
    title: Check Lulu print preview
    source: ISS-001
    text: "Author: review the Lulu print preview for the [T]-Theory volumes before printing."
  - id: calibrate-stereo
    title: Calibrate stereo glasses
    source: ISS-081
    text: "Author: calibrate the Atom with the glasses and projector, including depth comfort and layout."
  - id: record-voice
    title: Record H-AL voice material
    source: ISS-081
    text: "Author: record about one hour of clean single-speaker audio with transcripts; keep private voice work out of the public bundle."
