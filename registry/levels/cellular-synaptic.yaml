explain:
  cookie:
    text: Cells and synapses pass little electrical and chemical messages. This level watches how a small signal can cross
      a membrane or connection.
    draft: true
  general: Cells and synapses pass electrical and chemical signals through membranes and connections. The model follows how
    a local input can become a thresholded biological response.
  specialist: The substrate is the membrane/synapse system in the Field Atlas cellular plate. The cable-equation Green response
    treats injected current as a source and membrane voltage as the propagated field. Here the propagator is a local bioelectric
    impulse response constrained by membrane length constants and channel dynamics. Hopfield-memory language is sourced for
    the network model but is not a claim of standalone cellular consciousness.
atlas_rows:
  physical: Cell membranes, ion channels, organelles, synapses, and voltage-gated neural compartments.
  field: Bioelectric membrane-potential response propagated by ion channels and synaptic coupling.
  mind: Synaptic weight matrices store attractor patterns; this is neural information storage, not whole-person experience.
  equation_setting: (\partial_x^2-\lambda^{-2})V=I_{\mathrm{inject}}
