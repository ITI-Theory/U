explain:
  cookie:
    text: A city is many people, roads, rules, and habits connected together. The model follows how a change might spread
      through those connections.
    draft: true
  general: The city level follows how habits, information, and behaviours can spread through urban connections. Buildings
    and networks shape the paths of that spread.
  specialist: 'The substrate is the Field Atlas society/city plate: infrastructure and social interaction graph. The diffusion
    equation treats local change as a source that propagates through social and spatial coupling. The propagator is the cultural
    or interaction response constrained by boundaries such as class, geography, and media reach. Social-field claims are sourced
    or interpretive depending on use; agency and history remain necessary parameters.'
