explain:
  cookie:
    text: A body, brain, and senses work together when something happens. This view follows how a safe poke, sound, or feeling
      might move through the body as a model.
    draft: true
  general: The human level joins body, brain, senses, and regulation in one organism-scale model. A sound, touch, or other
    safe input is treated as a forcing term that moves through body and nervous-system dynamics.
  specialist: 'The substrate is the human/vertebrate organism: biotensegrity tissue, nervous system, limbic regulation, and
    cortical organization. The Langevin-style equation models affective state as gradient flow with noise and source forcing.
    The propagator means that a stimulus J(t) is tracked through somatic damping, memory, and attractor structure rather than
    reduced to one brain-only variable. Body and substrate claims are sourced to P1/P5/P9/P13; claims about subjective experience,
    trauma geometry, and care remain bounded hypotheses.'
