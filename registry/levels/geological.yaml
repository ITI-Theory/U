explain:
  cookie:
    text: Rocks and faults can hold stress for a very long time. A quake is one way that stored stress can suddenly move.
    draft: true
  general: Rocks and faults can store stress for a long time. The model follows how that stress moves as seismic waves or
    slow deformation.
  specialist: The substrate is the Field Atlas geological/seismic plate. The elastic wave equation models rock displacement
    under a stress impulse, with stiffness tensor and density setting the response. The propagator is measurable in seismology
    as the Earth response to earthquakes or controlled sources. Physical claims are sourced; geological memory is an interpretive
    but concrete stress-history analogy.
atlas_rows:
  physical: Tectonic plates, faults, elastic rock, stress-bearing crust, and lithospheric slabs.
  field: Seismic P-wave, S-wave, and surface-wave Green response through elastic rock.
  mind: 'Crustal stress distribution is geological memory: stored deformation and constraint, not awareness.'
