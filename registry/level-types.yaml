# Each level's substrate as an OpenCyc class: one set of types for Sherlock and the Soma
# Machine (ISS-063, author 13 Oct: "one set of types, from OpenCyc"). `cyc` and `note` are
# written by hand; the verdicts below them are written by `python sherlock/level_types.py --write`
# from NextKB and checked by `make -C sherlock level-types`. The app reads the verdicts
# (scripts/generate.py), so it needs no KB.
#   bears_feelings: can the substrate be the one who feels? OpenCyc's feelsEmotion takes an
#     IndividualAgent: proved (a genls path), refuted (a disjointWith above both) or unproved.
#   person: is it a Person? The human controls (BRECVEMA, appraisal, body map, thought sparks)
#     need proved.
levels:
  animal-swarm:
    cyc: Group
    note: a swarm is a group of animals; OpenCyc has no flock or swarm collection
    bears_feelings: refuted
    bears_feelings_why: Group genls Group, disjointWith IndividualAgent, which IndividualAgent genls
    person: refuted
    person_why: Group genls Group, disjointWith IndividualAgent, which Person genls
  atomic:
    cyc: Atom
    bears_feelings: refuted
    bears_feelings_why: Atom genls ExanimateObject, disjointWith Agent-Generic, which IndividualAgent genls
    person: refuted
    person_why: Atom genls ExanimateObject, disjointWith Agent-Generic, which Person genls
  bird:
    cyc: Bird
    bears_feelings: proved
    bears_feelings_why: Bird genls Biped genls Animal genls PerceptualAgent-Embodied genls EmbodiedAgent genls IndividualAgent
    person: refuted
    person_why: Bird genls NonPersonAnimal, disjointWith Person, which Person genls
  cellular-synaptic:
    cyc: Synapse
    bears_feelings: refuted
    bears_feelings_why: Synapse genls OrganismPart, disjointWith Agent-Generic, which IndividualAgent genls
    person: refuted
    person_why: Synapse genls MicroscopicScaleObject, disjointWith HumanScaleObject, which Person genls
  civilisational-solar:
    cyc: Society
    note: the social reading; the orbital reading is orbital-system
    bears_feelings: unproved
    bears_feelings_why: no genls path from Society to IndividualAgent in NextKB
    person: unproved
    person_why: no genls path from Society to Person in NextKB
  colony-roost:
