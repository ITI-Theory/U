# The studio standard: what every track, group, return and the master of a Soma Machine Live set is made of
# (ISS-120). Author, 19 Oct 2026: "a standard ... a STD track is: Serum, PP ... and in the strip, SSL standard
# ... if a track doesn't need, say, PP, it turns it off"; "if you don't know what a std track has, either you
# will use nothing or randomly download, install stuff, even generating stuff with Python".
#
# The rules:
# - Music is made in Ableton Live (author, 19 Oct): Live plays it, Live bounces it. No sound of our own making.
# - Anything not declared here is a proposal to the author: never installed, downloaded or generated.
# - A slot not needed is turned off, never removed: every track has the same shape, so the console, the
#   versions and the checks find the same slots in the same places.
# - Changed only by the author's decision; each change a new version.
# - In Live the standard is Live's own: a track preset or rack in the User Library ("Soma Standard") and a
#   template set, made by the author's hands; this file says what they hold.
# - A slot names one device, or alternatives (`or`), or a desk's device (`desk`: the chosen desk's, below); a
#   device written as a list is several devices in that order.
version: 2
status: draft          # for the author to approve or change
changes:
  - version: 2
    date: "2026-10-19"
    by: the author (the decisions) and Copilot (the facts)
    what:
      - >-
        The state is on the groups (the author, 19 Oct, keeping his 17 Oct decision: "keep the Serum 2 patches
        dry ... Snap Heap on the group bus ... the same modulation as Phase Plant, one light insert"); a track's
        state and wrong slots stay, off, for the versions' fine changes per instrument.
      - >-
        A correction (Copilot's, from the makers' documents): Phase Plant cannot follow Serum 2 on a track. It is
        an instrument with five generators and no audio input (kilohearts.com/docs/phase_plant), and Live lists it
        as an instrument only; an instrument cannot take another's audio in Live. Snap Heap is Kilohearts' effect
        (the same Snapins and modulation; Multipass for bands), so the state on audio is Snap Heap's. Phase Plant
        is a source: the Atmosphere's tracks (the Pad, the Sub Bass), as on 17 Oct.
      - The groups merged (17 Oct's and v1's), the CC lanes (the feelings as macros), Ozone 9 Advanced on the master, the CPU budget.
      - >-
        Four desks (the author: "add the rest to an alternative ... 4 outputs perhaps? SSL, Ozone, UAD, Live"):
        the same set mixed by four houses; one desk on at a time.
macros: [S, F, C, A, G, L, PV, Phi]   # Macros 1-8 wherever a slot has macros: the eight feelings (the rig)
cc:                    # what the app sends (the author, 19 Oct: the app sends the feelings, the patch decides the sound)
  1: "timbre (cutoff, brightness): the score's lane"
  11: "expression: the score's lane"
  19: "wavetable position (Serum 2's, and Phase Plant's on the Atmosphere): the score's lane"
  20: "S, safety: Macro 1"
  21: "F, fear: Macro 2"
  22: "C, curiosity: Macro 3"
  23: "A, awe: Macro 4"
  24: "G, grief: Macro 5"
  25: "L, language: Macro 6"
  26: "PV, the pre-verbal: Macro 7"
  29: "Φ, the field: Macro 8"
  note: >-
    The feelings as the rig sends them (registry/audio/rig.yaml, the audio branch, 18 Oct). The 17 Oct chats'
    lanes for drive, the comb and the gate (CC 20-22) are no longer lanes: they are what the macros do in each
    patch (drive from fear: timbral counterpoint), so the sound is decided in one place, the patch in Live.

track:                 # one per part (Violins I, Horns, Choir ...): one source per instrument
  slots:
    - slot: 1
      role: source     # what the instrument IS
      device: Serum 2
      or: [Phase Plant]   # the Atmosphere's tracks (the Pad, the Sub Bass): Phase Plant is a synth
      by_group: {Atmosphere: Phase Plant}   # the source a group's tracks use when it is not the first (the console reads it)
      default: on
      setting: >-
        the part's preset (its multisample); the source design (a second oscillator in Spectral or
        Granular mode on the same recording, blended by the macros) per instrument
    - slot: 2
      role: state      # what the field does to this one instrument: the versions' fine changes
      device: Snap Heap
      default: off     # the state is the group's (below); on where a version bends one instrument
      neutral: macros at zero change nothing (the master is the neutral version)
    - slot: 3
      role: wrong      # "OK, but slightly wrong": frequency shift, a few cents, comb, bitcrush, wow
      device: Snap Heap
      default: off
    - slot: 4
      role: modular    # the author, 19 Oct 23:2x: "modular should be added as well ... a very handy beast"
      device: Softube Modular FX
      default: off
      setting: >-
        modules per instrument and version: Mutable Instruments Clouds (grains: the pre-verbal) and Rings (the
        field ringing in response), Doepfer A-188-1 BBD (memory's wobbling echoes) and A-101-2 Vactrol LPG
        (slow decay), Buchla 296e (the spectrum shaped: grief), 4ms SMR (resonance: awe), Intellijel Rubicon,
        uFold II and Korgasmatron II (wrong at the source: fear, C-PTSD)
    - slot: 5
      role: strip
      desk: strip
      default: on
      setting: "the desk's strip, standard (set by the author: the starting point for every track)"
  sends:
    - {to: Space, default: standard}            # the shared hall
    - {to: Designed space, default: off}        # the designed spaces

group:                 # the stems; the author, 19 Oct: 17 Oct's groups, with the Choir, the Atmosphere as the electronics
  names: [Violins A, Violins B, Violas, Bass, Woodwinds, Brass High, Brass Low, Choir, Atmosphere]
  members:             # the score's 20 parts (Me/music/orchestra.py); Copilot's placing, the author's to move
    Violins A: [Violins I]
    Violins B: [Violins II, Strings Tremolo, Strings Pizz, Strings Muted]
    Violas: [Violas]
    Bass: [Celli, Contrabasses]
    Woodwinds: [Flute, Clarinet, Bassoon]
    Brass High: [Horns, Trumpets]
    Brass Low: [Trombones, Tuba]
    Choir: [Choir]
    Atmosphere: [Pad, Sub Bass, Pulse, Impact]
  slots:
    - {slot: 1, role: state, device: Snap Heap, or: [Multipass], default: on, note: "the section bends together: the feelings on its macros (drive, the comb, the gate among what they do)"}
    - {slot: 2, role: glue, desk: glue, default: on}
    - {slot: 3, role: colour, desk: colour, default: off}

returns:
  - {name: Space, role: the hall, desk: hall}
  - name: Designed space
    role: the designed spaces (any impulse response)
    device: kHs Convolver   # Kilohearts' (installed 20 Oct): a Snapin, so inside Snap Heap or Phase Plant the space bends with the feelings
    or: [Hybrid Reverb]     # Live's own: its convolution side loads any impulse response; no licence (the Live desk)
    # (20 Oct: Softube LoadIR, named in the 19 Oct installs, is not on disk nor in Softube's Amplifiers: dropped)
    proposal: >-
      Phase Plant as the designer of spaces (the author: "Phase Plant as the IR manipulator"): an impulse played
      through Phase Plant's Snapins on a track of its own, resampled in Live into a new impulse response, which
      Convolver plays (on the same Snapin chain, no resampling needed). The sound stays Live's.

master:
  slots:
    - {slot: 1, role: glue and loudness, desk: master, note: "Ozone 9 Advanced (the author, 19 Oct): one instance, its modules (the Maximizer, the Imager, Tonal Balance Control)"}
  delivery: open      # streaming about -14 LUFS; broadcast -23; film as the venue asks

desks:                 # the house that mixes; the same set, the same slots, four sounds (the Music Room's fourth output)
  # The names as Live lists them (its plugin database, 20 Oct 02:1x: SSL's 22 and UAD's 30 scanned; iZotope not yet).
  # SSL: Native Bus Compressor 2 installed 20 Oct 02:1x (in Live's list); G3 MultiBusComp (three bands) is there too.
  # X-Saturator installs as "v6" (Sherlock ignores a version tag).
  houses:
    ssl:     {strip: SSL Native Channel Strip 2, glue: SSL Native Bus Compressor 2, colour: SSL Native X-Saturator, hall: SSL Native FlexVerb, master: Ozone 9}
    izotope: {strip: Neutron 3, glue: Neutron 3 Compressor, colour: Neutron 3 Exciter, hall: open, master: Ozone 9}
    uad:     {strip: UADx API Vision Channel Strip, glue: UADx API 2500 Bus Compressor, colour: UADx Studer A800 Tape Recorder, hall: UADx Lexicon 224 Digital Reverb, master: Ozone 9}
    live:    {strip: [Channel EQ, Compressor], glue: Glue Compressor, colour: Saturator, hall: Hybrid Reverb, master: [Glue Compressor, Limiter]}
  default: ssl
  rule: >-
    One desk on at a time. In Live a desk is a rack's chain or the set saved per desk; a rack's chains all
    receive the audio and only the selected ones sound (Live 12 manual, Racks: chain select zones), so the
    desks not chosen are turned off, not only unselected. The Live desk needs no licence: anyone with Live
    opens it.
  installed: {ssl: "yes (20 Oct, 23 in Live)", izotope: "yes (20 Oct: Neutron 3 and its modules, Ozone 9, Nectar 3, RX 7 in Live)", uad: "yes (30 in Live)", live: "yes"}

budget:                # H-AL, 19 Oct (the author's earlier decisions): what the machine can carry
  live_sources: 16-24  # Serum 2 or Phase Plant instances playing at once
  the_rest: Frozen (Live's Freeze Track) or played from bounced stems with the source off; swapped in when a part changes
  groups: a group track cannot be frozen (Live 12 manual, 38.1.4), so the group's chain stays light (Snap Heap)

versions:              # one session; a version is the same slots with other settings and macro automation
  neutral: the master; every state and wrong slot neutral
  cptsd: the groups' state from the viewer's baseline (the film's viewer presets); a track's slots 2 and 3 on where one instrument bends
  asd: as cptsd
  adhd: as cptsd
  bounce: "per version and desk, stems per group (how, and per section or not: HAL, uat/RC3/hal-live-workflow-2026-10-19.md)"
installed: {Serum 2: "yes", Phase Plant: "yes", Snap Heap: "yes (in Live, 20 Oct)", Multipass: no (a proposal), kHs Convolver: "yes (in Live, 20 Oct)", Softube Modular FX: "yes (13 add-ons, 19 Oct)"}
