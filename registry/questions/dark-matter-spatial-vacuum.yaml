id: dark-matter-spatial-vacuum
question: What is dark matter?
short_answer: >-
  In ordinary science, dark matter is inferred from gravity, lensing, the CMB, and structure formation; its particle identity remains open. [T]-Theory proposes, under localisation and Kaluza-Klein assumptions, that the three non-compact spatial vacuum dimensions give $\Omega_{\mathrm{DM}}=3/11$, about 3.1% high against Planck 2018.
