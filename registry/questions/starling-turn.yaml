id: starling-turn
question: Why do starlings turn together?
short_answer: >-
  Ordinary active-matter science explains a turn as local neighbour updates propagating through positions and velocities, with no central commander. [T]-Theory uses the same measured pattern as an interpretive response-kernel example across bounded agents, not as a claim that the flock is one mind.
