id: black-hole-ringdown
question: What happens when black holes merge?
short_answer: >-
  In GR, a binary merger leaves a perturbed Kerr black hole whose gravitational-wave ringdown is measured as damped modes. [T]-Theory uses that as response grammar--source, boundary, decay, inferred state--without claiming compact objects are alive or conscious.
