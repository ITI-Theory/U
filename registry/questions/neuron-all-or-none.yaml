id: neuron-all-or-none
question: Why does a neuron fire all-or-nothing?
short_answer: >-
  In ordinary electrophysiology, passive cable voltage can stay subthreshold and decay, while voltage-gated membrane dynamics cross a spike threshold and enter a refractory period. The [T]-Theory demo labels that standard science as SOURCED; the added claim is only the shared source-kernel-threshold-response grammar already used at the human level.
