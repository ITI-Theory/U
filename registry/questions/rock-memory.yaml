id: rock-memory
question: Can a rock remember?
short_answer: >-
  In geology, rock preserves strain, faults, fabrics, and mineral records through ordinary mechanics and chemistry. [T]-Theory may call that a slow memory kernel only as an interpretive analogy for path dependence; it is not sentience or feeling.
