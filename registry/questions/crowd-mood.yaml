id: crowd-mood
question: Does a crowd have a mood?
short_answer: >-
  A crowd has measurable synchrony, density, sound, timing, and communication channels; those do not make it a single person. [T]-Theory treats group mood as an interpretive, bounded response field over separate agents, useful only when variables and evidence are stated.
