# Every Soma Machine feature, tagged science or show (ISS-095, author 14 Oct: "the Soma Machine is, by
# default, science, as it is; everything there because it looks good moves into presets behind
# ROOTED"). Copilot's proposal, 16 Oct 2026, for the author to approve feature by feature: set
# `approved: true` (or change the tag) and the code follows. Sherlock checks each feature's anchor is
# still in its file (`make -C sherlock features`), so the list cannot drift from the app.
#
#   science: in the default; it shows the model (the visual and sound grammars) or sourced anatomy
#            and physics, with its label
#   show:    there because it looks or sounds good, or entertains; ROOTED's (or already behind it)
#   both:    the science stays in the default, a show skin goes to ROOTED (named in `split`)
schema_version: 1
features:
