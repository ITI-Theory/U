# The UAT checklist (`HAL uat`, `make uat-run`; uat/scripts/uat.py).
# Steps run in order; each answer is recorded in uat/results/uat-<run>.yaml and the run can
# be resumed. kinds:
#   gate   run `run` (from U's root); show its last lines; the exit code is a hint, you decide
#   pdf    open each file in `files` (globs under bld/); look; answer
#   app    open `url` on the Soma Machine (dev server http://127.0.0.1:5199); try `do`; answer
#   manual a check by hand (hardware, a decision); `do` says what
# Answers: p pass, f fail, n note, s skip, c send to Copilot (VS Code chat), q quit.
# The sequence follows paper/UAT.md "Required UAT sequence"; the app checks follow ISSUES.md.
title: "[T]-Theory release UAT"
steps:
  # 1. the gates: the machine checks first
  - id: gate-lean
    kind: gate
    title: "The programme's Lean builds (no sorry, nothing resting on one)"
    run: "lake build 2>&1 | grep -vE 'OSforGFF|local changes' | tail -6"
  - id: gate-sherlock
    kind: gate
    title: "Sherlock: the affidavits are kernel-checked; the ledger agrees with the Lean"
    run: "make -C sherlock check 2>&1 | grep -E 'registry OK|sherlock checks|error' ; python sherlock/ledger.py report | tail -1; python sherlock/clinical.py | tail -1"
  - id: gate-wizard
    kind: gate
    title: "The Wizard: every book covers what it promised (registry/scopes.yaml); the gaps read"
    run: "make wizard 2>&1 | tail -12"
  - id: gate-release
    kind: gate
    title: "The release gate (bin/release-check): every FAIL read; WARNs known"
    run: "make uat-check 2>&1 | grep -E 'FAIL|WARN|PASS:' | head -30"
  - id: gate-explorer
    kind: gate
    title: "The Soma Machine's simulations tell their stories (explorer-check)"
    run: "cd apps/instrument/visuals/soma-field-operator && node scripts/explorer-check.mjs 2>&1 | grep -cE '^PASS' ; node scripts/explorer-check.mjs 2>&1 | grep -E 'FAIL' | head"
  # 2. the PDFs: visual acceptance (paper/UAT.md step 3)
  - id: pdf-papers
    kind: pdf
    title: "Each paper PDF: title page, abstract, contents, figures, no overflow"
    files: ["bld/papers/*.pdf"]
  - id: pdf-books
    kind: pdf
    title: "The domain books and the omnibus volumes"
    files: ["bld/books/book-*.pdf", "bld/books/ttheory-vol*.pdf"]
  - id: pdf-course-atlas
    kind: pdf
    title: "The course book and the Field Atlas"
    files: ["bld/textbook/*.pdf", "bld/atlas/*.pdf"]
  # 3. the Soma Machine, by hand
  - id: app-ureter-stages
    kind: app
    title: "The stone as a process: the four stages, inside and outside"
    url: "#voyage=ureter&dim=11&phi=0.5&uv=both"
    do: "STAGE ▸ through all four; POKE in each; VIEW inside/outside/both; does the pain come in waves?"
  - id: app-one-body
    kind: app
    title: "One body: the stone's waves reach the head; the limbic breath calms both"
    url: "#voyage=ureter&dim=11&phi=0.5"
    do: "LOOP: BODY + MIND; then BRAIN; raise C-PTSD, ADHD, ASD in turn; MINDFUL"
  - id: app-cathedral
    kind: app
    title: "The cathedral: thoughts, echoes, bubbles, outside, FX off"
    url: "#voyage=brain&dim=11&phi=0.6"
    do: "CAVE, THOUGHTS, POKE; C-PTSD echoes; a bubble pops in; OUTSIDE; FX to 0 shows the plain ventricles"
  - id: app-palace
    kind: app
    title: "The mind palace: ride the 21 floors, a door, a placed thought"
    url: "#voyage=brain&dim=11&phi=0.5"
    do: "PALACE; ▲ to floor 11 and back; PLACE; DOOR ▸"
  - id: app-vigilance
    kind: app
    title: "Vigilance: the view glances about with C-PTSD; settles with safety"
    url: "#voyage=ureter&dim=11&phi=0.5"
    do: "VIGILANCE; C-PTSD up; arrow keys and B; is it uncomfortable in the right way?"
  - id: app-towers
    kind: app
    title: "The towers of code and the Root Monster's tour"
    url: "#tour=root-monster"
    do: "follow the tour; click a tower; open a floor"
  - id: app-who
    kind: app
    title: "The way in: the splash, the choice (U blue, the scientist red), ROOTED through MOTHER (ISS-108)"
    url: ""
    do: "a private window (or MOTHER /who u|scientist): the splash, then the two buttons; U: the welcome tour, THE WORLDS; the scientist: the welcome tour, THE BASINS, the level view; MOTHER: REQUEST ACCESS and the code from the page source: the ROOTED badge, the Nostromo sounds, RICE, the Root Monster, SOMA WORLD; LEAVE ROOT puts it all back"
  - id: app-guide
    kind: app
    title: "The guide: tours as tabs, MY ROUTE, WHEREAMI (ISS-110)"
    url: "#voyage=worlds"
    do: "GUIDE: the tabs named by place, a click goes there; THE GUIDE's list; + HERE at three places, then play MY ROUTE; the WHEREAMI readout follows (time, place, scale, body part, Φ); click it to fold"
  - id: app-model
    kind: app
    title: "The model explains itself: THE MODEL HERE on the card; THE WHOLE MODEL as nine tabs (ISS-108)"
    url: "#voyage=brain&dim=11&phi=0.6"
    do: "open the card's THE MODEL HERE; each claim has its label (THEORY-STATUS); THE WHOLE MODEL: step the nine tabs; does anything claim more than its label?"
  - id: app-poke
    kind: app
    title: "POKE you can learn from: IMPULSE, RESPONSE, RETURN named over every view (ISS-108)"
    url: "#voyage=human&dim=11&phi=0.5"
    do: "POKE at the human, the brain, the landscape and the worlds; can a newcomer read what happened from the rings and the labels?"
  - id: app-worlds
    kind: app
    title: "THE WORLDS: the sea course, mini golf (the five fields), a tower's SOURCE, the cathedral corridor, the stargate (ISS-105)"
    url: "#voyage=worlds"
    do: "fly the sea course; mini golf: the five small fields change shape with the slider and have their rim; enter a tower and open its SOURCE; the corridor; Φ above 0.6 for the stargate"
  - id: app-tour-wording
    kind: manual
    title: "The urologist's tour (ureter, stent mode): the author reviews the wording (ISS-052)"
    do: "play the ureter tour; mark any line to put in your own words; no clinical claims (calculi sizes, laser settings stay out); send the list to Copilot (c)"
  - id: app-vsix
    kind: manual
    title: "The VS Code extension: install the VSIX and try it (ISS-090)"
    do: "npm run package in apps/vscode; code --install-extension apps/vscode/bld/soma-machine-0.1.0.vsix; open the Soma Machine view; the 14 stops, WAY IN among them"
  - id: app-feel
    kind: app
    title: "Say how you feel: MOTHER flies to it and says where it is in the brain, sourced (ISS-099)"
    url: "#voyage=worlds&dim=11"
    do: "MOTHER: type 'I feel anxious', then '/feel numb', then '/feel blorp'; the limbic hinge with that feeling, WHERE IS THIS FEELING? open, each line labelled, the DOI links work; does anything claim a region is the seat of a feeling?"
  - id: attest-scores
    kind: manual
    title: "Attest the scores: are these your emotions? (ISS-115, provenance)"
    do: "python sherlock/provenance.py; play each score in the app (SCORE stop: river-film, then fis-2021, which is Copilot's estimate from your 2021 notes); correct the numbers you disagree with; then set attested: {by: Alistair Johnson, on: <date>} in registry/scores/<id>.yaml"
  - id: app-grand-tour
    kind: app
    title: "The grand tour: every main place in order, each saying what happens next; the three FLY windows (docs/PIPELINE.md)"
    url: "#voyage=worlds&dim=11"
    do: "GUIDE: The grand tour; step through all 18; is each place right, is each jump (dive, doorway, elevator, tube, cut) the right kind, and are the three windows (inside a body, the earth, space) the views you want to fly in?"
  - id: app-physical-places
    kind: app
    title: "The physical places on their own: the halls and the tubes, no mind layers (ISS-104 step 1)"
    url: "#voyage=brain&hall=1&dim=11&phi=0.4"
    do: "the great hall, its doorways; the heart (voyage=body&hall=1); the soma (voyage=neuron&hall=1); the tubes: WAY IN, the cathedral, the way up, the ureter; do they read as places you could stand in, anatomy for the route, sci-fi for the look?"
  - id: app-gallery
    kind: app
    title: "A Gallery of Thoughts in the app: the rooms, the plates large (ISS-097)"
    url: "#voyage=worlds&dim=11"
    do: "GALLERY in the top bar; walk the 13 rooms; open plates, arrows, Esc; are the room texts in your voice, the [T]-stops right, any plate you would strike?"
  - id: app-show
    kind: manual
    title: "SHOW mode, the music film: the mix drives the machine (ROOTED; ISS-107)"
    do: "make show-cues MIX=<the Ozora WAV>; in the app, rooted: MOTHER /show; pick the WAV and bld/show/cues.json; PLAY; do the scenes change on phrases and drops, does Φ pulse with the kick, is the picture clean? Then REC + PLAY for a minute (share this tab with audio) and check the webm"
  # 4. the film (ISS-052): watch it whole, record it, review every line
  - id: film-river-90
    kind: app
    title: "The full River Film, 90 minutes: H-AL speaks each phase line; the thresholds hold"
    url: "?film=1#voyage=score&st=0&kv=1&kc=river"
    do: "touch the page once (browsers need it before H-AL can speak); MUSIC on; keep the tab visible; watch to the end; any SETTING"
  - id: film-record
    kind: manual
    title: "Record the film to a video file (H-AL's voice, music on)"
    do: "screen-record film-river-90 with system audio (e.g. OBS); keep the file outside the repos; note its path; then its sound: ffmpeg -i film.mp4 -ac 1 -ar 22050 film.wav and make -C sherlock readback REC=film.wav SCORE=river-film (does the film carry the score? ISS-115)"
  - id: film-review
    kind: manual
    title: "The author's review of every line of the film"
    do: "read the phase lines as H-AL speaks them (the recording); mark lines to put in your own words; send the list to Copilot (c)"
  # 5. the Monster: a real reader who did not build it (a reader test), and the BOFH Monster (an adversary)
  - id: monster-reader
    kind: manual
    title: "The Monster: one real reader per audience (therapist, doctor, musician, physicist) finds their way in"
    do: "give them the Atlas or their domain book and the app; ask them to find one thing they care about; note where they got lost"
  - id: monster-bofh
    kind: app
    title: "The BOFH Monster: misuse the app on purpose; nothing breaks, nothing overclaims"
    url: "#voyage=human&dim=11&phi=0.5"
    do: "POKE forty times; switch stops mid-dive; FX to 0 and 1 rapidly; open it on a phone; read every caption a hostile journalist would quote: is the label there?"
  # 5. hardware and decisions
  - id: hw-strap-twister
    kind: manual
    title: "Hardware: the Twister (MIDI IN), Ableton (MIDI OUT via loopMIDI)"
    do: "Engine Room: MIDI IN on, turn CC 0-9; MIDI OUT to Ableton"
  - id: hw-strap
    kind: manual
    title: "Hardware: one heart-rate strap or arm band end to end (ISS-091, ISS-111)"
    do: "Chrome or Edge; a Polar Verity Sense, Polar H10, Wahoo TICKR or similar: the STRAP button on the SCORE stop; the heart follows it; LOOP on, a rising heart slows the film; RMSSD, breaths a minute and coherence look plausible; note the model so the app's STRAP help can name it; then the BODY stop (the heart beats with yours), the DYAD (the first person at your rate) and the LANDSCAPE (a stressed heart shakes the ball): keep which?"
  - id: hw-screens
    kind: manual
    title: "Screens: a LAYOUT on the real monitors; a tablet through the relay; the overview on the real desk (ISS-100)"
    do: "Engine Room LAYOUT; make relay LAN=1; open a tablet with ?relay=…&token=…; the overview on the 32-inch screen with the tablets"
  - id: hw-projector
    kind: manual
    title: "The 3D projector: every stop in true 3D and 3D side by side, on the 100-inch screen (ISS-052, ISS-027)"
    do: "SETTINGS: 3D SBS; walk HUMAN, BODY, LIMBIC, NEURON, THOUGHT, LANDSCAPE, DYAD with the glasses; is the depth comfortable (DEPTH in the Engine Room); does anything sit wrong in depth?"
  - id: decide-lulu
    kind: manual
    title: "Decision: verify the three-volume Lulu split"
    do: "confirm Vol I, Vol II, and Vol III are each under Lulu's 800-page cap before print preview"
  - id: decide-p21
    kind: manual
    title: "Decision: review P21 and set it to pending-upload (ISS-001)"
    do: "read P21; edit Dist/PAPERS.yaml status"
