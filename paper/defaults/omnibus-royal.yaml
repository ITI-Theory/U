from: markdown+raw_tex+raw_html+fenced_divs+bracketed_spans+tex_math_dollars+pipe_tables+implicit_figures
to: pdf
pdf-engine: latexmk
pdf-engine-opts:
  - -xelatex
  - -silent
standalone: true
toc: true
toc-depth: 2
eol: lf
citeproc: false  # run as an explicit step in filters (before breakable-tokens)
bibliography: bibliography.bib
csl: apa-7th.csl
syntax-highlighting: tango
include-in-header:
  - omnibus.tex
filters:
  - filters/omnibus.lua
  - filters/lean-include.lua
  - filters/strip-keywords.lua
  - type: citeproc
  - ../lib/format/breakable-tokens.lua
variables:
  documentclass: memoir
  classoption:
    - openany
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  toccolor: NavyBlue
  hyperxmp: false
  monofont: JetBrains Mono
  fontsize: 10pt
  geometry: paperwidth=156mm,paperheight=234mm,twoside,inner=22mm,outer=18mm,top=22mm,bottom=25mm,bindingoffset=6mm
  header-includes: |
    \usepackage{amsmath}
    \usepackage{amssymb}
