from: ../lib/format/visualize-reader.lua
to: pdf
pdf-engine: xelatex
standalone: true
toc: true
number-sections: true
eol: lf
citeproc: false  # run as an explicit step in filters (before breakable-tokens)
bibliography: bibliography.bib
csl: apa-7th.csl
syntax-highlighting: tango
include-in-header:
  - journal.tex
filters:
  - ../lib/format/visualize.lua
  - filters/strip-keywords.lua
  - filters/boxes.lua
  - type: citeproc
  - ../lib/format/breakable-tokens.lua
variables:
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  toccolor: NavyBlue
  hyperxmp: false
  monofont: JetBrains Mono
  fontsize: 11pt
  linestretch: 1.6
  geometry: a4paper,margin=25mm
  header-includes: |
    \usepackage{amsmath}
    \usepackage{amssymb}
metadata:
  # {{Visualize}} (ISS-051): every figure is drawn and checked, none is shown in the
  # books (the figure library and HTML hold them).
  visualize-show: none
  visualize-manifest: ../bld/papers/visualize/manifest.json
  visualize-src: ../bld/papers/visualize
  visualize-render: python
  lean-root: proofs
