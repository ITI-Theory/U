from: markdown+raw_tex+raw_html+fenced_divs+bracketed_spans+tex_math_dollars+pipe_tables+implicit_figures
to: pdf
pdf-engine: latexmk
pdf-engine-opts:
  - -xelatex
  - -silent
standalone: true
toc: true
toc-depth: 2
eol: lf
citeproc: false  # run as an explicit step in filters (before breakable-tokens)
bibliography: bibliography.bib
csl: apa-7th.csl
syntax-highlighting: tango
include-in-header:
  - omnibus.tex
filters:
  - filters/omnibus.lua
  - ../lib/format/visualize.lua
  - filters/lean-include.lua
  - filters/strip-keywords.lua
  - type: citeproc
  - ../lib/format/breakable-tokens.lua
variables:
  documentclass: memoir
  classoption:
    - openany
    - a4paper
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  toccolor: NavyBlue
  hyperxmp: false
  monofont: JetBrains Mono
  fontsize: 10pt
  geometry: a4paper,twoside,inner=22mm,outer=20mm,top=20mm,bottom=22mm
  header-includes: |
    \usepackage{amsmath}
    \usepackage{amssymb}
metadata:
  # {{Visualize}} (ISS-051): every figure is drawn and checked, none is shown in the
  # papers (the figure library and HTML hold them).
  visualize-show: none
  visualize-manifest: ../bld/papers/visualize/manifest.json
  visualize-src: ../bld/papers/visualize
  visualize-render: python
  lean-root: proofs
