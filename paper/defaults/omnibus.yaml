from: markdown+raw_tex+raw_html+fenced_divs+bracketed_spans+tex_math_dollars+pipe_tables+implicit_figures
to: pdf
pdf-engine: latexmk
pdf-engine-opts:
  - -xelatex
  - -silent
standalone: true
toc: true
toc-depth: 2
eol: lf
citeproc: true
bibliography: bibliography.bib
csl: apa-7th.csl
syntax-highlighting: tango
include-in-header:
  - omnibus.tex
filters:
  - filters/omnibus.lua
  - filters/strip-keywords.lua
variables:
  documentclass: memoir
  classoption:
    - openany
    - a4paper
  colorlinks: true
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  toccolor: NavyBlue
  hyperxmp: false
  monofont: JetBrains Mono
  fontsize: 10pt
  geometry: a4paper,twoside,inner=22mm,outer=20mm,top=20mm,bottom=22mm
  header-includes: |
    \usepackage{amsmath}
    \usepackage{amssymb}
