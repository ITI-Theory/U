name = "OpenCyc"
defaultTargets = ["Cyc"]

# Core: terms, sentences, Holds (Cyc's ist), the inference rules (committed).
[[lean_lib]]
name = "Cyc"

# Generated from NextKB, one module per microtheory (make -C sherlock lean-gen).
[[lean_lib]]
name = "CycKB"
srcDir = "../bld/sherlock/lean"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "3448c0bcc5ce01b2d1546e483ec3620e32df3d0e"
# OpenCyc's Horn rules, generated (make -C sherlock rules-gen); import only Cyc.Rules.
[[lean_lib]]
name = "CycRules"
srcDir = "../bld/sherlock/lean"

# The concept registry's OpenCyc classes as Lean types, generated (make -C sherlock types).
[[lean_lib]]
name = "CycTypes"
srcDir = "../bld/sherlock/lean"

# Sherlock's readings: the type verdicts as theorems, generated (make -C sherlock readings-lean).
[[lean_lib]]
name = "CycReadings"
srcDir = "../bld/sherlock/lean"

# Queries and tests against generated microtheories.
[[lean_lib]]
name = "Queries"

# Sherlock affidavits: a document's claims typed against OpenCyc.
[[lean_lib]]
name = "Affidavits"

# Chats as Lean models (USC iteration 1): the model (committed).
[[lean_lib]]
name = "Chat"

# The chats, generated from Me/chats and their affidavits (private; make -C sherlock chats).
[[lean_lib]]
name = "Chats"
srcDir = "../bld/sherlock/lean"

# Questions to the chats, and the acceptance test of iteration 1.
[[lean_lib]]
name = "ChatQueries"

# The method's model: P3's co-identification procedure, registration rows and the loop (ISS-126).
[[lean_lib]]
name = "Method"

# The method's acceptance test: the paper's own row, COID-BS-HEAT-1.
[[lean_lib]]
name = "MethodQueries"

# U's issues as a model (ISS-126): the model (committed), the data from ISSUES.md (generated,
# make -C sherlock issues) and the questions.
[[lean_lib]]
name = "Issue"

[[lean_lib]]
name = "Issues"
srcDir = "../bld/sherlock/lean"

[[lean_lib]]
name = "IssueQueries"

# The {{usc:...}} tags (usc_tags.ebnf): the model (committed), the tags in the originals (generated,
# private: the chats'; make -C sherlock tags) and the questions.
[[lean_lib]]
name = "Tag"

[[lean_lib]]
name = "Tags"
srcDir = "../bld/sherlock/lean"

[[lean_lib]]
name = "TagQueries"
